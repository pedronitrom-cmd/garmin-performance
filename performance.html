<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garmin Performance Center</title>
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--s1:#131a2c;--s2:#1a2338;--s3:#222d47;--bd:#232d45;--bd2:#2f3b59;--tx:#edf1fa;--tx2:#b3bdd3;--mu:#7d88a4;
--g1:#22d3c5;--g2:#4c8dff;--g3:#8f80ee;--grad:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));
--c1:#4c8dff;--c2:#e06a30;--c3:#17a593;--c4:#bd8610;--c5:#d9588f;--c6:#8f80ee;--neu:#66748f;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--info:#6da7ec}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(900px 520px at 88% -8%,rgba(76,141,255,.20),transparent 62%),
 radial-gradient(700px 480px at 18% 4%,rgba(34,211,197,.11),transparent 60%),
 radial-gradient(800px 600px at 60% 108%,rgba(143,128,238,.14),transparent 62%)}
button,input,select{font:inherit;color:inherit}
/* ---------- menu lateral ---------- */
#side{position:fixed;inset:0 auto 0 0;width:252px;z-index:40;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;overflow-y:auto;
 background:linear-gradient(180deg,rgba(19,26,44,.96),rgba(10,15,28,.98));border-right:1px solid var(--bd)}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 6px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(76,141,255,.35)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-size:14.5px;letter-spacing:.01em;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--mu)}
.navt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:6px 10px 2px}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--tx2);cursor:pointer}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nv:hover{background:rgba(255,255,255,.045);color:var(--tx)}
.nv.on{color:#fff;background:linear-gradient(90deg,rgba(76,141,255,.22),rgba(143,128,238,.07))}
.nv.on:before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nv.on svg{stroke:var(--g1);opacity:1}
.sbox{margin-top:auto;border:1px solid var(--bd);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.02);font-size:12px;color:var(--tx2)}
.sbox label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
.sbox small{display:block;color:var(--mu);margin-top:8px;line-height:1.4}
input[type=number],input[type=search],select{background:var(--s2);color:var(--tx);border:1px solid var(--bd2);border-radius:8px;padding:6px 8px}
input[type=number]{width:66px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
#scrim{display:none;position:fixed;inset:0;z-index:35;background:rgba(4,7,14,.6);backdrop-filter:blur(2px)}
/* ---------- área principal ---------- */
#wrap{margin-left:252px;min-height:100vh}
#top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 26px;
 background:rgba(10,15,28,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
#burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--bd2);background:var(--s1);cursor:pointer;place-items:center}
#burger svg{width:18px;height:18px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
.ttl{display:flex;gap:12px;align-items:center;min-width:0}
.ttl h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.ttl small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{background:none;color:var(--tx2);border:0;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--grad);color:#06101f;font-weight:650}
main{max-width:1260px;margin:0 auto;padding:22px 26px 50px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.mt{margin-top:14px}
.card{position:relative;min-width:0;border-radius:16px;padding:16px 18px;border:1px solid var(--bd);
 background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),var(--s1);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.card h4{margin:0 0 2px;font-size:13.5px;font-weight:650}
.card .sub{color:var(--mu);font-size:12px;margin:0 0 10px}
.hero{border:1px solid transparent;background:linear-gradient(160deg,#16203a,#111829 60%) padding-box,var(--grad) border-box;padding:20px 22px}
.heroin{display:grid;grid-template-columns:auto 1fr;gap:22px 30px;align-items:center}
.bigv{display:grid;place-content:center;text-align:center;min-width:164px}.bigv b{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.05}.bigv span{font-size:12px;color:var(--mu)}
.ring{width:164px;height:164px;position:relative}
.ring svg{width:100%;height:100%}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring span{font-size:11.5px;color:var(--mu)}
.hero h3{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--tx2)}
.comp{display:grid;gap:8px;margin-top:14px}
.cp{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;font-size:12.5px;color:var(--tx2)}
.cp b{text-align:right;color:var(--tx);font-weight:650}
.trk{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.trk i.fb{background:var(--neu)}
.cp small{grid-column:2/4;color:var(--mu);margin-top:-5px;font-size:11.5px}
.kpi{padding:14px 16px 0;overflow:hidden}
.kpi span.l{color:var(--mu);font-size:12px}
.kpi b{display:block;font-size:25px;font-weight:680;letter-spacing:-.02em;margin:1px 0 2px}
.kpi b small{font-size:13px;font-weight:500;color:var(--tx2);letter-spacing:0}
.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--mu);margin-top:3px}
.kpi .sp{margin:8px -16px 0}
.kpi.np{padding-bottom:14px}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;border:1px solid var(--bd2);color:var(--tx2);white-space:nowrap}
.dl.good{color:#5fdc6b;border-color:#1d6b27;background:rgba(12,163,12,.10)}
.dl.bad{color:#f08a8a;border-color:#7a2a2a;background:rgba(208,59,59,.10)}
.dl.neu{color:#9cc4ff;border-color:#2c4a7c;background:rgba(76,141,255,.10)}
.ev{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.ev .card{padding-left:20px}
.ev .card:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--info)}
.ev .ok:before{background:var(--good)}.ev .warn:before{background:var(--warn)}.ev .bad:before{background:var(--crit)}
.ev h4{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd2);color:var(--tx2);font-weight:550}
.ok .badge{color:#5fdc6b;border-color:#1d6b27}.warn .badge{color:var(--warn);border-color:#7a5a0a}.bad .badge{color:#f08a8a;border-color:#7a2a2a}
.ev p{margin:5px 0 0;color:var(--tx2);font-size:13px}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cmp .hd h4{margin:0}
.cr{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;margin:6px 0}
.cr b{font-size:15px;font-weight:660;min-width:64px;text-align:right}
.cr.big{grid-template-columns:20px 1fr}
.cr.big b{text-align:left;font-size:21px;letter-spacing:-.01em}
.tg{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#06101f;background:var(--grad)}
.tg.b{background:var(--neu);color:#fff}
.cmp .trk{height:10px}
.abl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;color:var(--tx2);margin:12px 0 14px}
.abl span{display:inline-flex;gap:7px;align-items:center}
svg{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--mu);font-size:10.5px;font-family:inherit}
svg text.dl2{fill:var(--tx);font-size:11px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tx2);margin:8px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hit{fill:transparent}.hit:hover{fill:rgba(255,255,255,.06)}
.pt{stroke:var(--s1);stroke-width:2}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:550;cursor:default;position:sticky;top:0;background:#151d31;z-index:1}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td.l,th.l{text-align:left}
td.t{white-space:normal;min-width:180px;max-width:340px}
.sc{max-height:480px;overflow:auto;border:1px solid var(--bd);border-radius:12px}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--bd2);color:var(--tx2)}
.pill i{width:8px;height:8px;border-radius:50%;flex:none}
.note{font-size:12px;color:var(--mu);margin:10px 0 0}
#tip{position:fixed;pointer-events:none;z-index:60;background:#0a1020;border:1px solid var(--bd2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.45;display:none;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#tip b{color:#fff}
.bar1{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px}
.bar1 div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#06101f;font-weight:700;min-width:2px}
ul.q{margin:6px 0 0;padding-left:18px;color:var(--tx2)}ul.q li{margin:4px 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--tx2)}
.sech{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sech:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}
.sech:first-child{margin-top:0}
a{color:#8fb8ff}
@media(max-width:980px){
 #side{transform:translateX(-104%);transition:transform .22s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}
 body.open #side{transform:none} body.open #scrim{display:block}
 #wrap{margin-left:0} #burger{display:grid} #top{padding:10px 14px} main{padding:16px 14px 40px}
 .heroin{grid-template-columns:1fr;justify-items:center;text-align:center} .hero .comp{text-align:left;width:100%}
}
@media(max-width:560px){.ring{width:148px;height:148px}.cp{grid-template-columns:96px 1fr 34px}th,td{padding:6px 7px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

 const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return t}
function frame(w,h,m){return{w,h,m,iw:w-m.l-m.r,ih:h-m.t-m.b}}
function yGrid(F,sc,ticks,fmt){return ticks.map(v=>`<line x1="${F.m.l}" x2="${F.w-F.m.r}" y1="${sc(v)}" y2="${sc(v)}" stroke="#232d45" stroke-width="1"/><text x="${F.m.l-7}" y="${sc(v)+3.5}" text-anchor="end">${fmt(v)}</text>`).join('')}
function xTicksT(F,x,x0,x1,fmt=fmtM,k=6){let s='';for(let i=0;i<=k;i++){const v=x0+(x1-x0)*i/k;s+=`<text x="${x(v)}" y="${F.h-F.m.b+17}" text-anchor="${i==0?'start':i==k?'end':'middle'}">${fmt(v)}</text>`}return s}
const tipA=h=>` data-tip="${esc(h)}"`;
const legend=(items)=>items.length>1?`<div class="lg">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`:'';
const noData='<p class="note">Sem dados no período.</p>';

function lineChart({xs,series,w=CW(),h=230,yfmt=v=>v,ymin,ymax,xfmt=fmtM,tip,refs=[],ticksN=5,xk=6,endLabels=false}){
 const F=frame(w,h,{l:46,r:endLabels?44:14,t:12,b:26});const vals=series.flatMap(s=>s.vals.filter(v=>v!=null)).concat(refs.map(r=>r.v));
 if(!vals.length)return noData;
 let lo=ymin??Math.min(...vals),hi=ymax??Math.max(...vals);const tk=nice(lo,hi,ticksN);lo=ymin??tk[0];hi=ymax??tk[tk.length-1];
 const x0=xs[0],x1=xs[xs.length-1]||x0+1;const x=v=>F.m.l+(x1===x0?F.iw/2:(v-x0)/(x1-x0)*F.iw),y=v=>F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
 let defs='',s=yGrid(F,y,tk.filter(v=>v>=lo-1e-9&&v<=hi+1e-9),yfmt)+xTicksT(F,x,x0,x1,xfmt,xk);
 refs.forEach(r=>s+=`<line x1="${F.m.l}" x2="${w-F.m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c||NEU}" stroke-dasharray="4 4"/><text x="${w-F.m.r}" y="${y(r.v)-4}" text-anchor="end">${esc(r.t)}</text>`);
 series.forEach(se=>{const segs=[];let cur=null;se.vals.forEach((v,i)=>{if(v==null||xs[i]==null){cur=null;return}if(!cur){cur=[];segs.push(cur)}cur.push([x(xs[i]),y(v)])});
  const base=F.m.t+F.ih;
  segs.forEach(g=>{const d=g.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
   if(se.area&&g.length>1){const id=gid();defs+=gradV(id,se.c,se.areaO||.38,0);s+=`<path d="${d}L${g[g.length-1][0].toFixed(1)} ${base}L${g[0][0].toFixed(1)} ${base}Z" fill="url(#${id})"/>`}
   s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.sw||2}" stroke-linejoin="round" stroke-linecap="round"${se.dash?' stroke-dasharray="5 4"':''}${se.op?` opacity="${se.op}"`:''}/>`;
   if(endLabels&&se.n&&g===segs[segs.length-1]){const p=g[g.length-1];s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${se.c}" class="pt"/><text class="dl2" x="${(p[0]+8).toFixed(1)}" y="${(p[1]+4).toFixed(1)}">${esc(se.n)}</text>`}});
  if(xs.length<=40&&!se.nodots)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(xs[i]).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="${se.c}" class="pt"/>`})});
 const n=xs.length;xs.forEach((xv,i)=>{const a=i?(x(xs[i-1])+x(xv))/2:F.m.l,b=i<n-1?(x(xv)+x(xs[i+1]))/2:w-F.m.r;
  s+=`<rect class="hit" x="${a.toFixed(1)}" y="${F.m.t}" width="${Math.max(1,b-a).toFixed(1)}" height="${F.ih}"${tipA(tip(i))}/>`});
 return`<svg viewBox="0 0 ${w} ${h}" role="img"><defs>${defs}</defs>${s}</svg>`}

const barPath=(bx,ww,yt,yb)=>{const hh=Math.max(0,yb-yt),r=Math.min(4,ww/2,hh);return`M${bx.toFixed(1)} ${yb}V${(yt+r).toFixed(1)}Q${bx.toFixed(1)} ${yt.toFixed(1)} ${(bx+r).toFixed(1)} ${yt.toFixed(1)}H${(bx+ww-r).toFixed(1)}Q${(bx+ww).toFixed(1)} ${yt.toFixed(1)} ${(bx+ww).toFixed(1)} ${(yt+r).toFixed(1)}V${yb}Z`};
function barChart({cats,vals,w=CW(),h=230,color=C[0],tip,yfmt=v=>v,labels,line,lineC=C[1],hl}){
 if(!cats.length)return noData;
 const F=frame(w,h,{l:46,r:14,t:12,b:26});const hi0=Math.max(...vals,...(line||[]).filter(v=>v!=null),1);const tk=nice(0,hi0,5),hi=tk[tk.length-1];
 const y=v=>F.m.t+F.ih-v/hi*F.ih;const bw=F.iw/cats.length;const id=gid();let s=yGrid(F,y,tk,yfmt);
 const step=Math.ceil(cats.length/8);cats.forEach((c,i)=>{if(i%step===0)s+=`<text x="${F.m.l+bw*(i+.5)}" y="${h-F.m.b+17}" text-anchor="middle">${labels?labels[i]:c}</text>`});
 const pad=Math.min(2,bw*.15);
 vals.forEach((v,i)=>{const bx=F.m.l+bw*i+pad,ww=Math.max(1,bw-2*pad);
  if(v>0)s+=`<path d="${barPath(bx,ww,y(v),F.m.t+F.ih)}" fill="url(#${id})"${hl!=null&&i!==hl?' opacity=".8"':''}/>`;
  s+=`<rect class="hit" x="${F.m.l+bw*i}" y="${F.m.t}" width="${bw}" height="${F.ih}"${tipA(tip(i))}/>`});
 if(line){let d='',pen=false;line.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+(F.m.l+bw*(i+.5)).toFixed(1)+' '+y(v).toFixed(1);pen=true});s+=`<path d="${d}" fill="none" stroke="${lineC}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`}
 return`<svg viewBox="0 0 ${w} ${h}" role="img"><defs>${gradV(id,color,1,.55)}</defs>${s}</svg>`}

function groupBars({labels,series,w=CW(),h=240,tip,yfmt=v=>v}){
 const F=frame(w,h,{l:46,r:14,t:12,b:26});const hi0=Math.max(1,...series.flatMap(se=>se.vals.filter(v=>v!=null)));const tk=nice(0,hi0,5),hi=tk[tk.length-1];
 const y=v=>F.m.t+F.ih-v/hi*F.ih;const bw=F.iw/labels.length,k=series.length,inner=bw*.76,ww=Math.max(1,(inner-2*(k-1))/k);
 let defs='',s=yGrid(F,y,tk,yfmt);const ids=series.map(se=>{const id=gid();defs+=gradV(id,se.c,1,.55);return id});

  series.forEach((se,j)=>{const v=se.vals[i];if(v>0)s+=`<path d="${barPath(F.m.l+bw*i+(bw-inner)/2+j*(ww+2),ww,y(v),F.m.t+F.ih)}" fill="url(#${ids[j]})"/>`});
  s+=`<rect class="hit" x="${F.m.l+bw*i}" y="${F.m.t}" width="${bw}" height="${F.ih}"${tipA(tip(i))}/>`});

function stackChart({cats,stacks,colors,w=CW(),h=230,tip,yfmt=v=>v,labels}){
 if(!cats.length)return noData;
 const F=frame(w,h,{l:46,r:14,t:12,b:26});const tot=stacks.map(sum);const tk=nice(0,Math.max(...tot,1),5),hi=tk[tk.length-1];
 const y=v=>F.m.t+F.ih-v/hi*F.ih;const bw=F.iw/cats.length;let s=yGrid(F,y,tk,yfmt);const step=Math.ceil(cats.length/8);
 cats.forEach((c,i)=>{if(i%step===0)s+=`<text x="${F.m.l+bw*(i+.5)}" y="${h-F.m.b+17}" text-anchor="middle">${labels[i]}</text>`;
  let acc=0;const bx=F.m.l+bw*i+2,ww=Math.max(1,bw-4);stacks[i].forEach((v,k)=>{if(v<=0)return;const y1=y(acc+v),y0=y(acc);s+=`<rect x="${bx}" y="${y1}" width="${ww}" height="${Math.max(0,y0-y1)}" rx="1.5" fill="${colors[k]}" stroke="#131a2c" stroke-width="2"/>`;acc+=v});

function scatter({pts,w=CW(),h=250,yfmt,xmin,xmax,ymin,ymax,flip=false,xfmt}){
 const F=frame(w,h,{l:50,r:14,t:12,b:26});const xv=pts.map(p=>p.x),yv=pts.map(p=>p.y);if(!pts.length)return noData;
 const x0=xmin??Math.min(...xv),x1=xmax??Math.max(...xv);let tk=nice(ymin??Math.min(...yv),ymax??Math.max(...yv),5);const lo=tk[0],hi=tk[tk.length-1];
 const x=v=>F.m.l+(x1===x0?F.iw/2:(v-x0)/(x1-x0)*F.iw),y=v=>flip?F.m.t+(v-lo)/(hi-lo)*F.ih:F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
 let s=tk.map(v=>`<line x1="${F.m.l}" x2="${w-F.m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#232d45"/><text x="${F.m.l-7}" y="${y(v)+3.5}" text-anchor="end">${yfmt(v)}</text>`).join('')+xTicksT(F,x,x0,x1,xfmt||fmtM,5);
 pts.forEach(p=>{s+=`<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="5" fill="${p.c}" class="pt"/><circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="12" fill="transparent"${tipA(p.tip)}/>`});
 return`<svg viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`}

function spark(vals,c=C[0],w=220,h=46){const v=vals.filter(x=>x!=null);if(v.length<2)return`<svg viewBox="0 0 ${w} ${h}"></svg>`;
 const lo=Math.min(...v),hi=Math.max(...v),n=vals.length,id=gid();const X=i=>i/(n-1)*w,Y=x=>4+(h-10)*(1-(hi===lo?.5:(x-lo)/(hi-lo)));

 return`<div class="ring"><svg viewBox="0 0 164 164" role="img" aria-label="Índice ${Math.round(v)} de 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3c5"/><stop offset=".55" stop-color="#4c8dff"/><stop offset="1" stop-color="#8f80ee"/></linearGradient></defs>

const sech=t=>`<div class="sech">${t}</div>`;
/* variação entre dois valores. dir: +1 maior é melhor, -1 menor é melhor, 0 neutro */
function delta(a,b,{dir=0,mode='pct',dec=1,unit='',tol}={}){if(a==null||b==null||!isFinite(a)||!isFinite(b)||(mode==='pct'&&!b))return'<span class="dl">sem base</span>';
 const d=a-b,p=mode==='pct'?d/Math.abs(b)*100:d,mag=Math.abs(p);const zero=mag<(tol??(mode==='pct'?.5:mode==='pace'?1:10**-dec/2));
 const cls=zero?'':dir===0?'neu':((d>0)===(dir>0)?'good':'bad');
 const txt=mode==='pct'?f1(mag,mag<10?1:0)+'%':mode==='pace'?Math.round(mag)+' s/km':f1(mag,dec)+unit;
 return`<span class="dl ${cls}">${zero?'= estável':(d>0?'▲ ':'▼ ')+txt}</span>`}

/* ============ cálculos ============ */
function inR(a){return a.ms>=sinceMs()}
function weeklyAll(){const wk=new Map();for(const a of ACTS){const w=weekStart(a.ms);const o=wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]};
  o.km+=a.km;o.sec+=a.sec;o.n++;o.days.add(a.d);o.load+=trimp(a);zoneSec(a).forEach((v,i)=>o.z[i]+=v);wk.set(w,o)}
 const first=Math.min(...wk.keys()),last=weekStart(NOW()),out=[];for(let w=first;w<=last;w+=7*DAY)out.push(wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]});return out}
function loadSeries(){const m=new Map();for(const a of ACTS)m.set(a.ms,(m.get(a.ms)||0)+trimp(a));
 const start=Math.min(...ACTS.map(a=>a.ms)),end=NOW();const o={xs:[],ctl:[],atl:[],tsb:[],ld:[]};let c=0,t=0;
 for(let d=start;d<=end;d+=DAY){const l=m.get(d)||0,tsb=c-t;c+=(l-c)/42;t+=(l-t)/7;o.xs.push(d);o.ctl.push(c);o.atl.push(t);o.tsb.push(tsb);o.ld.push(l)}return o}
const win=(from,to)=>ACTS.filter(a=>a.ms>=from&&a.ms<=to);
function monthlyAgg(list){const m=new Map();for(const a of list){const k=a.d.slice(0,7);const o=m.get(k)||{k,km:0,n:0,sec:0};o.km+=a.km;o.n++;o.sec+=a.sec;m.set(k,o)}return[...m.values()].sort((a,b)=>a.k<b.k?-1:1)}
const keyOf=t=>{t=norm(t);return['desafio do parque','fau run','live run','abc','nilson lima','10 milhas','circuito','zumbi'].find(k=>t.includes(k))||null};
function gapsList(){const asc=[...ACTS].sort((a,b)=>a.ms-b.ms),g=[];for(let i=1;i<asc.length;i++){const d=(asc[i].ms-asc[i-1].ms)/DAY;if(d>21)g.push([asc[i-1].ms,asc[i].ms,Math.round(d)])}return g}
const movAvg=(arr,k)=>arr.map((v,i)=>{const w=arr.slice(Math.max(0,i-k+1),i+1).filter(x=>x!=null);return w.length>=Math.ceil(k/2)?mean(w):null});
/* estatísticas de uma janela [from,to] — base dos comparativos */
function stats(from,to){const L=win(from,to),km=sum(L.map(a=>a.km)),sec=sum(L.map(a=>a.sec)),days=new Set(L.map(a=>a.d)).size,span=Math.round((to-from)/DAY)+1;
 const z=[0,0,0,0,0];L.forEach(a=>zoneSec(a).forEach((s,k)=>z[k]+=s));const zt=sum(z);const e=L.filter(isEasy),rr=REC.r.filter(r=>r.ms>=from&&r.ms<=to);
 const sl=rr.map(r=>r.sl).filter(v=>v!=null),vf=rr.map(r=>r.vfc).filter(v=>v!=null);
 return{from,to,L,n:L.length,km,sec,days,span,dpw:days/(span/7),pace:km?sec/km:null,hr:sec?sum(L.map(a=>a.hr*a.sec))/sec:null,load:sum(L.map(trimp)),long:L.length?Math.max(...L.map(a=>a.km)):null,
  easy:zt?(z[0]+z[1])/zt*100:null,hard:zt?(z[3]+z[4])/zt*100:null,ne:e.length,ef:e.length>=3?median(e.map(EF)):null,epace:e.length>=3?median(e.map(a=>a.pace)):null,ehr:e.length>=3?median(e.map(a=>a.hr)):null,
  sl:sl.length>=3?mean(sl):null,vfc:vf.length>=3?mean(vf):null,nr:rr.length}}

function assess(){const N=NOW(),ev=[];const add=(sev,tag,title,text)=>ev.push({sev,tag,title,text});
 const w28=win(N-27*DAY,N),p28=win(N-55*DAY,N-28*DAY),b84=win(N-139*DAY,N-56*DAY);
 const v=sum(w28.map(a=>a.km)),vp=sum(p28.map(a=>a.km)),vb=sum(b84.map(a=>a.km))/3;
 const pct=vp?(v-vp)/vp*100:null;
 add(pct!=null&&Math.abs(pct)>35?'warn':'ok',pct==null?'—':(pct>=0?'+':'')+f1(pct,0)+'%','Volume (28 dias)',
  `${f1(v)} km em ${w28.length} treinos, contra ${f1(vp)} km nos 28 dias anteriores e média de ${f1(vb)} km por bloco de 28 dias nas 12 semanas antes disso. ${pct!=null&&pct>35?'Salto grande de volume: vale segurar a progressão.':pct!=null&&pct<-35?'Volume bem abaixo do recente (polimento ou queda de ritmo de treino).':'Variação dentro de uma faixa normal.'}`);
 const L=loadSeries(),i=L.xs.length-1,ctl=L.ctl[i],atl=L.atl[i],tsb=L.tsb[i];
 const a7=sum(L.ld.slice(-7)),c28=sum(L.ld.slice(-28))/4,acwr=c28?a7/c28:null;
 const sevL=acwr==null?'info':acwr>1.5?'bad':acwr>1.3?'warn':acwr<.8?'warn':'ok';
 add(sevL,acwr==null?'—':'ACWR '+f1(acwr,2),'Carga de treino',`Forma (CTL, 42d) ${f1(ctl,0)} · fadiga (ATL, 7d) ${f1(atl,0)} · equilíbrio (TSB) ${f1(tsb,0)}. Carga aguda/crônica ${f1(acwr,2)} (faixa 0,8–1,3 costuma ser a mais segura). ${acwr!=null&&acwr<.8?'Carga recente baixa (esperado após prova ou semana leve). ':''}${tsb>5?'Você está descansado: bom momento para uma sessão-chave ou prova.':tsb<-20?'Fadiga acumulada alta: priorize sono e treinos leves.':'Equilíbrio neutro entre forma e fadiga.'}`);
 const W=weeklyAll(),cw=W.slice(-9,-1);const dpw=mean(cw.map(w=>w.days.size)),zero=cw.filter(w=>w.n===0).length;
 add(dpw>=4?'ok':dpw>=3?'info':'warn',f1(dpw)+' dias/sem','Consistência (8 semanas completas)',`Média de ${f1(dpw)} dias corridos por semana e ${zero} semana(s) sem treino. Semanas: ${cw.map(w=>f1(w.km,0)).join(' · ')} km.`);
 const lg1=win(N-27*DAY,N).filter(a=>a.cat!=='Prova'||a.km>=10),lgA=Math.max(0,...lg1.map(a=>a.km)),lgB=Math.max(0,...win(N-83*DAY,N-28*DAY).map(a=>a.km));
 add('info',f1(lgA)+' km','Longão',`Maior corrida dos últimos 28 dias: ${f1(lgA)} km; nas 8 semanas anteriores: ${f1(lgB)} km. Maior corrida do histórico: ${f1(Math.max(...ACTS.map(a=>a.km)))} km.`);
 const zs=[0,0,0,0,0];w28.forEach(a=>zoneSec(a).forEach((s,k)=>zs[k]+=s));const zt=sum(zs)||1,easy=(zs[0]+zs[1])/zt*100,hard=(zs[3]+zs[4])/zt*100,mid=zs[2]/zt*100;
 add(hard>30?'warn':easy>=65?'ok':'info',f1(easy,0)+'% fácil','Distribuição de intensidade (28 dias)',`Z1+Z2 ${f1(easy,0)}% · Z3 ${f1(mid,0)}% · Z4+Z5 ${f1(hard,0)}% do tempo (zonas por FC de reserva, FCmáx ${S.hrmax}/repouso ${S.hrrest}). Referência 80/20: ~75–80% fácil. ${hard>30?'Muito tempo em intensidade alta: risco de acumular fadiga.':mid>35?'Muito tempo na zona cinza (Z3): fácil fica rápido demais e o forte não sai forte.':'Distribuição saudável.'}`);
 const e1=win(N-55*DAY,N).filter(isEasy),e0=win(N-111*DAY,N-56*DAY).filter(isEasy);
 if(e1.length>=4&&e0.length>=4){const a=median(e1.map(EF)),b=median(e0.map(EF)),d=(a/b-1)*100;
  add(d>=1.5?'ok':d<=-1.5?'warn':'info',(d>=0?'+':'')+f1(d)+'%','Eficiência aeróbica',`Em rodagens fáceis, a eficiência (ritmo ÷ FC) variou ${d>=0?'+':''}${f1(d)}% nas últimas 8 semanas vs as 8 anteriores. Ritmo mediano ${fmtP(median(e1.map(x=>x.pace)))}/km a ${f1(median(e1.map(x=>x.hr)),0)} bpm, antes ${fmtP(median(e0.map(x=>x.pace)))}/km a ${f1(median(e0.map(x=>x.hr)),0)} bpm. ${d>=1.5?'Sinal de adaptação positiva.':d<=-1.5?'Piora: calor, sono ruim ou fadiga podem explicar.':'Estável.'}`)}
 const races=ACTS.filter(a=>a.cat==='Prova');const lr=races[0];
 if(lr){const k=keyOf(lr.title);const prev=k?races.find(r=>r!==lr&&keyOf(r.title)===k&&Math.abs(r.km-lr.km)<.4&&r.ms<lr.ms&&lr.ms-r.ms<420*DAY):null;
  add('info',fmtT(lr.sec),'Última prova',`${esc(lr.title)} (${fmtD(lr.ms)}): ${f1(lr.km,2)} km em ${fmtT(lr.sec)} (${fmtP(lr.pace)}/km), FC ${lr.hr}/${lr.hrmax}.`+(prev?` Mesma prova em ${fmtD(prev.ms)}: ${fmtT(prev.sec)} (${prev.sec>lr.sec?'-':'+'}${Math.abs(Math.round(lr.sec-prev.sec))}s hoje), FC ${prev.hr}/${prev.hrmax}.`:''))}
 const mm=REC.m;if(mm.length>14){const g=(a,b,j)=>mean(mm.slice(a,b).map(r=>r[j]).filter(v=>v!=null));
  const sh=g(1,4,1),sh0=g(13,16,1),ss=g(1,4,2),ss0=g(13,16,2);const k=REC.k||{};
  const hv=mean(mm.slice(1,13).map(r=>r[3])),rh=median(mm.slice(1,13).map(r=>r[6]));
  const okHrv=k.vfc==null||k.vfc7==null||k.vfc>=k.vfc7*.92,okRhr=k.fcr==null||k.fcr<=rh+3;
  add(okHrv&&okRhr&&(sh>=6.5)?'ok':'warn',k.vfc!=null?`VFC ${k.vfc} ms`:'—','Recuperação',`${k.vfc!=null?`VFC noturna ${k.vfc} ms (média 7d ${k.vfc7}; média mensal 12m ${f1(hv,0)}). FC de repouso ${k.fcr} bpm (mediana 12m ${f1(rh,0)}). `:''}Sono médio dos últimos 3 meses: ${f1(sh)} h / score ${f1(ss,0)}, contra ${f1(sh0)} h / ${f1(ss0,0)} no mesmo período de um ano atrás${sh0-sh>.4?' — queda relevante de sono, o ponto mais fraco da recuperação':''}.`)}
 return ev}

/* índice do painel: heurística própria (não é métrica Garmin), 5 componentes de 0 a 100 */
function scoreIndex(){const N=NOW(),out=[];
 const W=weeklyAll(),cw=W.slice(-9,-1),dpw=mean(cw.map(w=>w.days.size))||0,zero=cw.filter(w=>w.n===0).length;
 out.push({n:'Consistência',v:clamp(dpw/5*100-zero*10),t:`${f1(dpw)} dias/sem nas últimas 8 semanas`});
 const L=loadSeries(),a7=sum(L.ld.slice(-7)),c28=sum(L.ld.slice(-28))/4,ac=c28?a7/c28:null;
 if(ac!=null)out.push({n:'Carga',v:clamp(ac>=.8&&ac<=1.3?100:ac<.8?40+ac/.8*60:100-(ac-1.3)/.5*80),t:`carga aguda/crônica ${f1(ac,2)} (ideal 0,8–1,3)`});
 const zs=[0,0,0,0,0];win(N-27*DAY,N).forEach(a=>zoneSec(a).forEach((s,k)=>zs[k]+=s));const zt=sum(zs);
 if(zt){const easy=(zs[0]+zs[1])/zt*100,hard=(zs[3]+zs[4])/zt*100;out.push({n:'Intensidade',v:clamp(100-Math.max(0,70-easy)*1.5-Math.max(0,hard-25)*3),t:`${f1(easy,0)}% do tempo em zona fácil (28 dias)`})}
 const e1=win(N-55*DAY,N).filter(isEasy),e0=win(N-111*DAY,N-56*DAY).filter(isEasy);
 if(e1.length>=4&&e0.length>=4){const d=(median(e1.map(EF))/median(e0.map(EF))-1)*100;out.push({n:'Eficiência',v:clamp(60+d*10),t:`${d>=0?'+':''}${f1(d)}% em 8 semanas nas rodagens fáceis`})}
 const k=REC.k||{},mm=REC.m;if(k.vfc!=null&&mm.length>4){const rh=median(mm.slice(1,13).map(r=>r[6])),sh=mean(mm.slice(1,4).map(r=>r[1]).filter(v=>v!=null));let v=100;
  if(k.vfc7!=null&&k.vfc<k.vfc7*.92)v-=25;if(k.fcr!=null&&rh!=null&&k.fcr>rh+3)v-=25;if(sh!=null&&sh<6)v-=40;else if(sh!=null&&sh<6.5)v-=25;else if(sh!=null&&sh<7)v-=10;
  out.push({n:'Recuperação',v:clamp(v),t:`VFC ${k.vfc} ms · sono médio ${f1(sh)} h (3 meses)`})}
 return{parts:out,total:mean(out.map(o=>o.v))||0}}

function repSessions(){const out=[];for(const a of ACTS){if(!['Intervalado','Limiar/Ritmo'].includes(a.cat)||!a.laps.length)continue;
  const reps=a.laps.filter(l=>l.km>=.35&&l.sec/l.km<=265);if(reps.length<3)continue;const pc=reps.map(l=>l.sec/l.km),hr=reps.map(l=>l.hr).filter(v=>v!=null);
  const med=median(reps.map(l=>l.km)),grp=med<.5?'400 m':med<.7?'600 m':med<.9?'800 m':'1 km';
  out.push({a,n:reps.length,grp,avg:mean(pc),best:Math.min(...pc),fade:(pc[pc.length-1]/pc[0]-1)*100,hr:mean(hr),hrmax:Math.max(...hr,0)})}
 return out}

const GD={'5k':['5 km',5000],'10k':['10 km',10000],'21k':['Meia maratona',21097.5],'42k':['Maratona',42195]};

function vdotOf(m,sec){const t=sec/60,v=m/t,o=-4.6+.182258*v+.000104*v*v,f=.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t);return o/f}

function timeAt(V,m){let lo=3,hi=600;for(let i=0;i<80;i++){const t=(lo+hi)/2;if(vdotOf(m,t*60)>V)lo=t;else hi=t}return(lo+hi)/2*60}
function parseT(s){const p=String(s).trim().split(':').map(Number);if(!p.length||p.some(x=>!isFinite(x)))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:null}

function pgMeta(){const N=NOW(),g=S.goal,gd=GD[g.d]||GD['10k'],ts=parseT(g.t),cv=curVdot();

 /* o que mudar */

function planBuild(){const N=NOW(),W=weeklyAll(),g=S.goal,Vo=curVdot(),Vc=Vo?Vo.v:50,dpw=+S.dpw||5,base=mean(mondayKm(4))||30,start=weekStart(N)+7*DAY;

 const dc=F.map(a=>a.x.c3-a.x.c1),dg=F.filter(a=>a.x.g1!=null&&a.x.g3!=null).map(a=>a.x.g3-a.x.g1);
 const sec4=sech('Fadiga: começo × fim do treino')+(F.length>=3?card('Treinos de 8 km ou mais','1º terço contra último terço. Cadência caindo e contato com o solo subindo no fim indicam fadiga mecânica.',`<div class="sc" style="max-height:none"><table><thead><tr><th class="l">Data</th><th class="l">Treino</th><th>km</th><th>Cadência</th><th>Variação</th><th>Contato</th><th>2ª metade</th></tr></thead><tbody>${fr}</tbody></table></div>`,`<p class="note">Mediana: cadência ${sgn1(median(dc))} spm${dg.length?` e contato ${sgn1(median(dg))} ms`:''} do começo ao fim.</p>`):noX('Cadência do início e do fim.'));
 /* calor */
 const T=L.filter(a=>a.x.tp!=null);
 const bands=[[0,18,'abaixo de 18 °C'],[18,22,'18 a 22 °C'],[22,26,'22 a 26 °C'],[26,30,'26 a 30 °C'],[30,99,'acima de 30 °C']];
 const EZ=T.filter(isEasy);
 const br=bands.map(([lo,hi,n])=>{const g=EZ.filter(a=>a.x.tp>=lo&&a.x.tp<hi);if(!g.length)return'';return`<tr><td class="l">${n}</td><td>${g.length}</td><td>${fmtP(mean(g.map(a=>a.pace)))}</td><td>${f1(mean(g.map(a=>a.hr)),0)}</td><td>${f1(mean(g.map(EF)),3)}</td></tr>`}).join('');
 const sp=EZ.length>=8?scatter({pts:ptsOf(EZ,a=>a.x.tp,a=>EF(a)),yfmt:v=>f1(v,2),xfmt:v=>Math.round(v)+'°'}):'';
 const hot=EZ.filter(a=>a.x.tp>=26),cool=EZ.filter(a=>a.x.tp<22);
 const cost=hot.length>=3&&cool.length>=3?`<p class="note">Em treino fácil, acima de 26 °C a sua eficiência (EF) fica ${f1(Math.abs(mean(hot.map(EF))/mean(cool.map(EF))-1)*100,0)}% ${mean(hot.map(EF))<mean(cool.map(EF))?'menor':'maior'} que abaixo de 22 °C.</p>`:'';
 const sec5=sech('Calor')+(T.length>=5?`<div class="grid g2">${card('Eficiência por faixa de temperatura','Só treinos fáceis (comparáveis). EF = velocidade ÷ FC; maior é melhor.',br?`<div class="sc" style="max-height:none"><table><thead><tr><th class="l">Temperatura</th><th>Treinos</th><th>Ritmo</th><th>FC</th><th>EF</th></tr></thead><tbody>${br}</tbody></table></div>`:noData,cost+'<p class="note">A temperatura vem do sensor do relógio, que lê alguns graus acima do ar quando você está parado ou protegido do vento.</p>')}${card('EF × temperatura','Cada ponto é um treino fácil.',sp||noData)}</div>`:noX('Temperatura.'));
 /* terreno */
 const G=L.filter(a=>a.x.gap!=null).slice(0,12);
 const gr=G.map(a=>{const d=a.pace-a.x.gap;return`<tr><td class="l">${fmtD(a.ms)}</td><td class="l t">${esc(a.title)}</td><td>${f1(a.km,1)}</td><td>${a.x.up!=null?Math.round(a.x.up)+' m':'—'}</td><td>${fmtP(a.pace)}</td><td>${fmtP(a.x.gap)}</td><td>${Math.abs(d)<1.5?'=':(d>0?'−':'+')+Math.round(Math.abs(d))+' s'}</td></tr>`}).join('');
 const wk=weeklyAll().slice(-13,-1),wup=wk.map(w=>sum(L.filter(a=>weekStart(a.ms)===w.w).map(a=>a.x.up||0)));
 const sec6=sech('Terreno')+`<div class="grid g2">${G.length?card('Ritmo real × ritmo ajustado à inclinação','GAP: o ritmo que o seu esforço equivale no plano. Se o GAP é mais rápido que o real, o percurso era duro.',`<div class="sc" style="max-height:none"><table><thead><tr><th class="l">Data</th><th class="l">Treino</th><th>km</th><th>Subida</th><th>Real</th><th>GAP</th><th>Custo</th></tr></thead><tbody>${gr}</tbody></table></div>`):card('Ritmo ajustado','',noX('Altimetria.'))}${sum(wup)>0?card('Subida por semana','Metros de ganho de elevação nas últimas 12 semanas.',barChart({cats:wk.map(w=>w.w),vals:wup,labels:wk.map(w=>fmtDM(w.w)),tip:i=>`<b>Semana de ${fmtD(wk[i].w)}</b><br>${Math.round(wup[i])} m de subida`,h:200})):card('Subida por semana','',noX('Altimetria.'))}</div>`;
 /* carga Garmin */
 const LD=L.filter(a=>a.x.ld!=null&&a.hr>0);
 const rr=LD.length>=8?pearson(LD.map(trimp),LD.map(a=>a.x.ld)):null;
 const TE=L.filter(a=>a.x.te!=null&&a.ms>=N-89*DAY),tb=[[0,2,'Manutenção (menos de 2)'],[2,3,'Melhora (2 a 3)'],[3,4,'Melhora forte (3 a 4)'],[4,5.1,'Muito forte (4 ou mais)']];
 const ter=tb.map(([lo,hi,n])=>`<tr><td class="l">${n}</td><td>${TE.filter(a=>a.x.te>=lo&&a.x.te<hi).length}</td></tr>`).join('');
 const sec7=sech('Carga de treino: Garmin × este painel')+`<div class="grid g2">${LD.length>=8?card('Carga Garmin × TRIMP','Cada ponto é uma corrida. As duas medidas devem andar juntas.',scatter({pts:ptsOf(LD,a=>trimp(a),a=>a.x.ld),yfmt:v=>Math.round(v),xfmt:v=>Math.round(v)}),rr!=null?`<p class="note">Correlação ${f2(rr)}. ${rr>.8?'As duas contam a mesma história; pode confiar na carga do painel.':'Elas divergem em parte: o Garmin considera efeito de treino e recuperação, o painel só FC e duração.'}</p>`:''):card('Carga Garmin','',noX('Carga de treino.'))}${TE.length>=3?card('Efeito aeróbico, últimos 90 dias','Quantas corridas caíram em cada faixa.',`<div class="sc" style="max-height:none"><table><thead><tr><th class="l">Faixa</th><th>Corridas</th></tr></thead><tbody>${ter}</tbody></table></div>`,`<p class="note">Treino bom para evoluir costuma ficar entre 3 e 4; muitos treinos abaixo de 2 só mantêm o nível.</p>`):card('Efeito de treino','',noX('Efeito aeróbico.'))}</div>`;
 return sec1+sec2+sec3+sec4+sec5+sec6+sec7}
const sgn1=v=>v==null?'—':(v>=0?'+':'−')+f1(Math.abs(v),0);
const f2=v=>v==null?'—':(v<0?'−':'')+Math.abs(v).toFixed(2).replace('.',',');

function pgBody(){const D=(WX.d||[]).map(r=>({d:r[0],ms:toMs(r[0]),deep:r[1],rem:r[2],lig:r[3],awk:r[4],st:r[5],stp:r[6],sp:r[7],rs:r[8]})).sort((a,b)=>a.ms-b.ms),N=NOW();
 if(!D.length)return noX('Sono por fases, estresse e passos.');
 const win_=(n)=>D.filter(r=>r.ms>=N-(n-1)*DAY),w14=win_(14),p14=D.filter(r=>r.ms<N-13*DAY&&r.ms>=N-27*DAY);
 const av=(L,k)=>{const v=L.map(r=>r[k]).filter(v=>v!=null);return v.length>=3?mean(v):null};
 const tot=r=>(r.deep||0)+(r.rem||0)+(r.lig||0);
 const pc=(L,k)=>{const v=L.filter(r=>r[k]!=null&&tot(r)>2).map(r=>r[k]/tot(r)*100);return v.length>=3?mean(v):null};
 const K=[['Sono profundo',pc(w14,'deep'),pc(p14,'deep'),'% do sono','%',0,1],['Sono REM',pc(w14,'rem'),pc(p14,'rem'),'% do sono','%',0,1],['Estresse médio',av(w14,'st'),av(p14,'st'),'0 a 100','',0,-1],['Passos por dia',av(w14,'stp'),av(p14,'stp'),'média','',0,0],['SpO₂',av(w14,'sp'),av(p14,'sp'),'%','%',0,0],['Respiração',av(w14,'rs'),av(p14,'rs'),'resp./min','',1,0]].filter(k=>k[1]!=null);
 const kp=K.map(([n,v,pv,sub,u,d,dir])=>kpiCard(n,f1(v,d)+(u?'<small>'+u+'</small>':''),sub+' · 14 dias',pv==null?'':delta(v,pv,{dir,mode:'abs',dec:d,unit:u,tol:d?.2:1}))).join('');
 const wks=[];for(let i=11;i>=0;i--){const lo=N-(i*7+6)*DAY,hi=N-i*7*DAY,g=D.filter(r=>r.ms>=lo&&r.ms<=hi&&tot(r)>2);wks.push({lo,g})}
 const st=wks.map(w=>w.g.length>=2?[mean(w.g.map(r=>r.deep||0)),mean(w.g.map(r=>r.rem||0)),mean(w.g.map(r=>r.lig||0))]:[0,0,0]);
 const sch=st.some(s=>sum(s)>0)?stackChart({cats:wks.map(w=>w.lo),stacks:st,colors:[C[0],C[5],NEU],labels:wks.map(w=>fmtDM(w.lo)),yfmt:v=>f1(v,0)+'h',tip:i=>`<b>Semana de ${fmtD(wks[i].lo)}</b><br>Profundo ${f1(st[i][0])} h · REM ${f1(st[i][1])} h · Leve ${f1(st[i][2])} h`}):noX('Fases do sono.');
 const sl=card('Fases do sono por semana','Média por noite, últimas 12 semanas.',sch,legend([['Profundo',C[0]],['REM',C[5]],['Leve',NEU]]));
 const d90=D.filter(r=>r.ms>=N-89*DAY),line=(k,c,fm,un)=>d90.filter(r=>r[k]!=null).length>=7?lineChart({xs:d90.map(r=>r.ms),series:[{c,vals:d90.map(r=>r[k]),sw:1.2,op:.4,nodots:true},{c,vals:movAvg(d90.map(r=>r[k]),7),area:true}],xfmt:fmtDM,yfmt:fm,tip:i=>`<b>${fmtD(d90[i].ms)}</b><br>${d90[i][k]==null?'—':f1(d90[i][k],0)+un}`,h:200}):noX('Este dado.');
 /* sono e estresse x eficiência no dia seguinte */
 const byD=new Map(D.map(r=>[r.d,r])),ez=ACTS.filter(isEasy);
 const pr=ez.map(a=>{const p=byD.get(new Date(a.ms-DAY).toISOString().slice(0,10)),n=byD.get(a.d);return{a,p,n}}).filter(o=>o.n||o.p);
 const cr=(f)=>{const v=pr.filter(o=>f(o)!=null);return v.length>=12?{r:pearson(v.map(f),v.map(o=>EF(o.a))),n:v.length}:null};
 const cs=[['Sono profundo da noite',cr(o=>o.n&&o.n.deep!=null&&tot(o.n)>2?o.n.deep/tot(o.n)*100:null)],['Horas de sono da noite',cr(o=>o.n&&tot(o.n)>2?tot(o.n):null)],['Estresse do dia anterior',cr(o=>o.p?o.p.st:null)],['Passos do dia anterior',cr(o=>o.p?o.p.stp:null)]].filter(c=>c[1]);
 const rel=cs.length?card('O que anda junto com um treino fácil eficiente','Correlação (−1 a +1) entre cada hábito e a eficiência (EF) do treino fácil seguinte.',`<div class="sc" style="max-height:none"><table><thead><tr><th class="l">Hábito</th><th>Correlação</th><th>Treinos</th></tr></thead><tbody>${cs.map(([n,c])=>`<tr><td class="l">${n}</td><td>${c.r==null?'—':f2(c.r)}</td><td>${c.n}</td></tr>`).join('')}</tbody></table></div>`,`<p class="note">Valores abaixo de 0,3 (em módulo) são fracos e podem ser acaso. Correlação não prova causa.</p>`):'';
 /* peso */
 const W=(WX.w||[]).map(r=>({d:r[0],ms:toMs(r[0]),kg:r[1],fat:r[2]})).sort((a,b)=>a.ms-b.ms),lastW=W[W.length-1];
 let wp;if(!W.length)wp=card('Peso','',`<p class="note">Nenhuma medição de peso chegou do Garmin. Pese-se na balança conectada ou lance o peso no Garmin Connect para ele aparecer aqui.</p>`);
 else{const age=Math.round((N-lastW.ms)/DAY),old=age>14;const w90=W.filter(r=>r.ms>=N-179*DAY);
  wp=card('Peso',old?`Última medição há ${age} dias (${fmtD(lastW.ms)}): ${f1(lastW.kg)} kg. Está desatualizado; eu não usaria este número para nada até pesar de novo.`:`Última medição: ${f1(lastW.kg)} kg em ${fmtD(lastW.ms)}.`,w90.length>=3?lineChart({xs:w90.map(r=>r.ms),series:[{c:C[1],vals:w90.map(r=>r.kg),area:true}],xfmt:fmtDM,yfmt:v=>f1(v,1),tip:i=>`<b>${fmtD(w90[i].ms)}</b><br>${f1(w90[i].kg)} kg`,h:200}):'',`<p class="note">Pesar toda semana, no mesmo horário e em jejum, vale mais do que muitos dados soltos. Peso afeta o ritmo: perto de 1 kg a menos costuma valer 2 a 3 s/km.</p>`)}
 return`<div class="grid kpis">${kp}</div>`+sech('Sono e rotina')+`<div class="grid g2">${sl}${card('Estresse','Média diária e média de 7 dias, últimos 90 dias.',line('st',C[1],v=>Math.round(v),''))}${card('Passos por dia','Média de 7 dias, últimos 90 dias.',line('stp',C[2],v=>f1(v/1000,0)+'k',''))}${rel||''}</div>`+sech('Peso')+wp}

/* ============ navegação e render ============ */
const PAGES=[
 ['resumo','Resumo','Como você está hoje',pgResumo,0,'<path d="M4 13a8 8 0 1 1 16 0"/><path d="M12 13l4-5"/><path d="M5 19h14"/>'],
 ['comparativos','Comparativos','Um período contra o outro',pgComparativos,0,'<path d="M7 4v16M7 4L3 8M7 4l4 4"/><path d="M17 20V4m0 16l4-4m-4 4l-4-4"/>'],
 ['meta','Meta e projeção','Quanto falta e o que mudar',pgMeta,0,'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
 ['plano','Plano de treino','Próximas semanas',pgPlano,0,'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
 ['biomec','Biomecânica e clima','Passada, calor, terreno e carga',pgBio,0,'<circle cx="12" cy="5" r="2"/><path d="M12 8v6l-3 6M12 14l3 6M8 11l4-1 4 2"/>'],
 ['corpo','Corpo e rotina','Sono, estresse e peso',pgBody,0,'<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.500-7 10-7 10z"/>'],
 ['volume','Volume','Quanto você corre',pgVolume,1,'<path d="M5 20V11M12 20V4M19 20v-6"/>'],
 ['carga','Carga','Forma, fadiga e equilíbrio',pgCarga,1,'<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
 ['intensidade','Intensidade','Onde você passa o tempo',pgIntens,1,'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 1-9z"/>'],
 ['eficiencia','Eficiência','Ritmo × FC nas rodagens fáceis',pgEficiencia,1,'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'],
 ['provas','Provas','Resultados, recordes e projeções',pgProvas,0,'<path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/>'],
 ['prerace','Antes das provas','O que explica cada resultado',pgPre,0,'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'],
 ['exec','Execução de prova','Ritmo km a km',pgExec,0,'<path d="M3 17l5-6 4 3 5-8 4 5"/>'],
 ['intervalados','Intervalados','Qualidade das repetições',pgInterv,1,'<path d="M4 9h13l-3-3M20 15H7l3 3"/>'],
 ['recuperacao','Recuperação','Sono, VFC e prontidão',pgRec,0,'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'],
 ['treinos','Treinos','Todas as atividades',pgTreinos,1,'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'],
 ['dados','Qualidade dos dados','O que olhar com cuidado',pgDados,0,'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>']];
function render(){
 if(!ACTS.length){$('#app').innerHTML='<p>Sem dados.</p>';return}
 const pg=PAGES.find(p=>p[0]===S.page)||PAGES[0];S.page=pg[0];GID=0;
 $('#nav').innerHTML=PAGES.map(p=>`<button class="nv${p[0]===S.page?' on':''}" data-p="${p[0]}"${p[0]===S.page?' aria-current="page"':''}><svg viewBox="0 0 24 24">${p[5]}</svg>${p[1]}</button>`).join('');
 $('#nav').querySelectorAll('.nv').forEach(b=>b.onclick=()=>go(b.dataset.p));
 $('#ptitle').innerHTML=`${pg[1]}<small>${pg[2]}</small>`;document.title=pg[1]+' · Garmin Performance Center';
 const rg=$('#rng');rg.style.display=pg[4]?'':'none';
 rg.innerHTML=[['all','Tudo'],['12m','12 meses'],['6m','6 meses'],['90d','90 dias'],['30d','30 dias']].map(([k,t])=>`<button data-r="${k}" class="${S.range===k?'on':''}">${t}</button>`).join('');
 rg.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;S.all=false;render()});
 $('#stamp').innerHTML=`${ACTS.length} atividades · até ${fmtD(ACTS[0].ms)}<br>${esc(SRC)}`;
 $('#app').innerHTML=pg[3]();
 if(S.page==='treinos'){$('#fcat').value=S.cat;$('#fq').value=S.q;$('#fcat').onchange=e=>{S.cat=e.target.value;renderTable()};$('#fq').oninput=e=>{S.q=e.target.value;renderTable()};renderTable()}
 bindCtl();
 if(S.page==='prerace'){const sel=$('#prace');if(sel)sel.onchange=ev=>{S.race=ev.target.value;const y=scrollY;render();scrollTo(0,y)}}
 if(S.page==='comparativos')$('#cmpseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.cmp=b.dataset.c;const y=scrollY;render();scrollTo(0,y)})}
function go(p){S.page=p;if(location.hash!=='#'+p)history.pushState(null,'','#'+p);document.body.classList.remove('open');render();scrollTo(0,0)}
function fromHash(){const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h))S.page=h}
addEventListener('popstate',()=>{fromHash();render();scrollTo(0,0)});
$('#burger').onclick=()=>document.body.classList.toggle('open');
$('#scrim').onclick=()=>document.body.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('open')});

/* tooltip (mouse e toque) */
const tip=$('#tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
 tip.innerHTML=t.getAttribute('data-tip');tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=Math.max(8,e.clientX-r.width-14);if(y+r.height>innerHeight-8)y=Math.max(8,e.clientY-r.height-14);tip.style.left=x+'px';tip.style.top=y+'px'}
document.addEventListener('mousemove',showTip);
document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true,capture:true});

/* controles */
$('#hmax').onchange=e=>{S.hrmax=clamp(+e.target.value||190,150,220);e.target.value=S.hrmax;render()};
$('#hrest').onchange=e=>{S.hrrest=clamp(+e.target.value||45,30,80);e.target.value=S.hrrest;render()};

let _cw=CW(),_rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(CW()!==_cw){_cw=CW();render()}},200)});
goalInit();loadRaw(RAW);fromHash();render();
</script>
