<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Performance Center</title>
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Performance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--s1:#131a2c;--s2:#1a2338;--s3:#222d47;--bd:#232d45;--bd2:#2f3b59;--tx:#edf1fa;--tx2:#b3bdd3;--mu:#7d88a4;
--g1:#22d3c5;--g2:#4c8dff;--g3:#8f80ee;--grad:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));
--c1:#4c8dff;--c2:#e06a30;--c3:#17a593;--c4:#bd8610;--c5:#d9588f;--c6:#8f80ee;--neu:#66748f;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--info:#6da7ec}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(900px 520px at 88% -8%,rgba(76,141,255,.20),transparent 62%),
 radial-gradient(700px 480px at 18% 4%,rgba(34,211,197,.11),transparent 60%),
 radial-gradient(800px 600px at 60% 108%,rgba(143,128,238,.14),transparent 62%)}
button,input,select{font:inherit;color:inherit}
/* ---------- menu lateral ---------- */
#side{position:fixed;inset:0 auto 0 0;width:252px;z-index:40;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;overflow-y:auto;
 background:linear-gradient(180deg,rgba(19,26,44,.96),rgba(10,15,28,.98));border-right:1px solid var(--bd)}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 6px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(76,141,255,.35)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-size:14.5px;letter-spacing:.01em;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--mu)}
.navt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:6px 10px 2px}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--tx2);cursor:pointer}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nv:hover{background:rgba(255,255,255,.045);color:var(--tx)}
.nv.on{color:#fff;background:linear-gradient(90deg,rgba(76,141,255,.22),rgba(143,128,238,.07))}
.nv.on:before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.nv.on svg{stroke:var(--g1);opacity:1}
.sbox{margin-top:auto;border:1px solid var(--bd);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.02);font-size:12px;color:var(--tx2)}
.sbox label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
.sbox small{display:block;color:var(--mu);margin-top:8px;line-height:1.4}
input[type=number],input[type=search],select{background:var(--s2);color:var(--tx);border:1px solid var(--bd2);border-radius:8px;padding:6px 8px}
input[type=number]{width:66px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
#scrim{display:none;position:fixed;inset:0;z-index:35;background:rgba(4,7,14,.6);backdrop-filter:blur(2px)}
/* ---------- área principal ---------- */
#wrap{margin-left:252px;min-height:100vh}
#top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 26px;
 background:rgba(10,15,28,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
#burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--bd2);background:var(--s1);cursor:pointer;place-items:center}
#burger svg{width:18px;height:18px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
.ttl{display:flex;gap:12px;align-items:center;min-width:0}
.ttl h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.ttl small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{background:none;color:var(--tx2);border:0;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--grad);color:#06101f;font-weight:650}
main{max-width:1260px;margin:0 auto;padding:22px 26px 50px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.mt{margin-top:14px}
.card{position:relative;min-width:0;border-radius:16px;padding:16px 18px;border:1px solid var(--bd);
 background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),var(--s1);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.card h4{margin:0 0 2px;font-size:13.5px;font-weight:650}
.card .sub{color:var(--mu);font-size:12px;margin:0 0 10px}
.hero{border:1px solid transparent;background:linear-gradient(160deg,#16203a,#111829 60%) padding-box,var(--grad) border-box;padding:20px 22px}
.heroin{display:grid;grid-template-columns:auto 1fr;gap:22px 30px;align-items:center}
.bigv{display:grid;place-content:center;text-align:center;min-width:164px}.bigv b{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.05}.bigv span{font-size:12px;color:var(--mu)}
.ring{width:164px;height:164px;position:relative}
.ring svg{width:100%;height:100%}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring span{font-size:11.5px;color:var(--mu)}
.hero h3{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--tx2)}
.comp{display:grid;gap:8px;margin-top:14px}
.cp{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;font-size:12.5px;color:var(--tx2)}
.cp b{text-align:right;color:var(--tx);font-weight:650}
.trk{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.trk i.fb{background:var(--neu)}
.cp small{grid-column:2/4;color:var(--mu);margin-top:-5px;font-size:11.5px}
.kpi{padding:14px 16px 0;overflow:hidden}
.kpi span.l{color:var(--mu);font-size:12px}
.kpi b{display:block;font-size:25px;font-weight:680;letter-spacing:-.02em;margin:1px 0 2px}
.kpi b small{font-size:13px;font-weight:500;color:var(--tx2);letter-spacing:0}
.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--mu);margin-top:3px}
.kpi .sp{margin:8px -16px 0}
.kpi.np{padding-bottom:14px}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;border:1px solid var(--bd2);color:var(--tx2);white-space:nowrap}
.dl.good{color:#5fdc6b;border-color:#1d6b27;background:rgba(12,163,12,.10)}
.dl.bad{color:#f08a8a;border-color:#7a2a2a;background:rgba(208,59,59,.10)}
.dl.neu{color:#9cc4ff;border-color:#2c4a7c;background:rgba(76,141,255,.10)}
.ev{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.ev .card{padding-left:20px}
.ev .card:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--info)}
.ev .ok:before{background:var(--good)}.ev .warn:before{background:var(--warn)}.ev .bad:before{background:var(--crit)}
.ev h4{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd2);color:var(--tx2);font-weight:550}
.ok .badge{color:#5fdc6b;border-color:#1d6b27}.warn .badge{color:var(--warn);border-color:#7a5a0a}.bad .badge{color:#f08a8a;border-color:#7a2a2a}
.ev p{margin:5px 0 0;color:var(--tx2);font-size:13px}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cmp .hd h4{margin:0}
.cr{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;margin:6px 0}
.cr b{font-size:15px;font-weight:660;min-width:64px;text-align:right}
.cr.big{grid-template-columns:20px 1fr}
.cr.big b{text-align:left;font-size:21px;letter-spacing:-.01em}
.tg{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#06101f;background:var(--grad)}
.tg.b{background:var(--neu);color:#fff}
.cmp .trk{height:10px}
.abl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;color:var(--tx2);margin:12px 0 14px}
.abl span{display:inline-flex;gap:7px;align-items:center}
svg{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--mu);font-size:10.5px;font-family:inherit}
svg text.dl2{fill:var(--tx);font-size:11px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tx2);margin:8px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hit{fill:transparent}.hit:hover{fill:rgba(255,255,255,.06)}
.pt{stroke:var(--s1);stroke-width:2}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:550;cursor:default;position:sticky;top:0;background:#151d31;z-index:1}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td.l,th.l{text-align:left}
td.t{white-space:normal;min-width:180px;max-width:340px}
.sc{max-height:480px;overflow:auto;border:1px solid var(--bd);border-radius:12px}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--bd2);color:var(--tx2)}
.pill i{width:8px;height:8px;border-radius:50%;flex:none}
.note{font-size:12px;color:var(--mu);margin:10px 0 0}
#tip{position:fixed;pointer-events:none;z-index:60;background:#0a1020;border:1px solid var(--bd2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.45;display:none;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#tip b{color:#fff}
.bar1{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px}
.bar1 div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#06101f;font-weight:700;min-width:2px}
ul.q{margin:6px 0 0;padding-left:18px;color:var(--tx2)}ul.q li{margin:4px 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--tx2)}
.sech{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sech:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}
.sech:first-child{margin-top:0}
a{color:#8fb8ff}
@media(max-width:980px){
 #side{transform:translateX(-104%);transition:transform .22s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}
 body.open #side{transform:none} body.open #scrim{display:block}
 #wrap{margin-left:0} #burger{display:grid} #top{padding:10px 14px} main{padding:16px 14px 40px}
 .heroin{grid-template-columns:1fr;justify-items:center;text-align:center} .hero .comp{text-align:left;width:100%}
}
@media(max-width:560px){.ring{width:148px;height:148px}.cp{grid-template-columns:96px 1fr 34px}th,td{padding:6px 7px}}

/* ---------- brilho e movimento ---------- */
.card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.card:hover{transform:translateY(-2px);border-color:var(--bd2);box-shadow:0 16px 40px rgba(0,0,0,.34)}
main>.grid>.card:nth-child(2){animation-delay:.05s}main>.grid>.card:nth-child(3){animation-delay:.1s}main>.grid>.card:nth-child(4){animation-delay:.15s}main>.grid>.card:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.3s ease-out both;filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--c,#4c8dff) 55%,transparent))}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.gp{animation:gdraw 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes gdraw{from{stroke-dasharray:0 400}}
.rd{transform-origin:190px 150px;animation:rpop .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rpop{from{transform:scale(.2);opacity:0}}
.hc{transition:opacity .15s}.hc:hover{opacity:.7;stroke:#fff;stroke-width:1}
.bgrow path{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.pano{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:22px 24px;border:1px solid transparent;background:radial-gradient(600px 220px at 85% 0,rgba(76,141,255,.22),transparent 70%),radial-gradient(500px 200px at 10% 120%,rgba(34,211,197,.16),transparent 70%),linear-gradient(160deg,#16203a,#111829 70%) padding-box,var(--grad) border-box}
.pano h3{margin:0;font-size:26px;letter-spacing:-.02em}.pano p{margin:4px 0 0;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--bd2);font-size:12.5px;color:var(--tx2)}.chip b{color:#fff;font-size:15px;margin-right:3px}
.gg{grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))}
@media(max-width:560px){.gg{grid-template-columns:1fr 1fr}.gauge svg{width:118px;height:118px}.gauge .gv{height:118px;top:16px}.gauge .gv b{font-size:27px}.pano h3{font-size:21px}}
.gauge{display:grid;justify-items:center;padding:16px 12px 14px;text-align:center;position:relative}
.gauge svg{width:150px;height:150px}
.gauge .gv{position:absolute;top:16px;left:0;right:0;height:150px;display:grid;place-content:center}
.gauge .gv b{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}.gauge .gv span{font-size:11px;color:var(--mu);margin-top:3px}
.gauge .gl{font-size:12.5px;color:var(--tx2);margin-top:6px;min-height:2.4em}
.pr{padding:16px 18px;display:grid;gap:3px;overflow:hidden}
.pr:before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(250,178,25,.28),transparent 70%)}
.pr b{font-size:30px;letter-spacing:-.02em;background:linear-gradient(135deg,#ffe29a,#fab219 60%,#e06a30);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.pr i{font-style:normal;font-size:12px;color:var(--mu)}
.medal{width:max-content;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 9px;border-radius:99px;background:rgba(250,178,25,.14);color:#fab219;border:1px solid rgba(250,178,25,.4)}

/* ---------- navegação de app ---------- */
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.tabs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -4px -2px;padding:2px 4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--bd2);background:rgba(255,255,255,.03);color:var(--tx2);border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tabs button:hover{color:var(--tx);border-color:#3d4b70}
.tabs button.on{background:var(--grad);color:#06101f;border-color:transparent;font-weight:650}
#bnav{display:none}
@media(max-width:980px){
 #bnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around;padding:6px;border-radius:20px;background:rgba(17,24,41,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.5)}
 #bnav button{flex:1;display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--mu);font-size:10.5px;padding:6px 2px;border-radius:14px;cursor:pointer;transition:color .2s,background .2s}
 #bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 #bnav button.on{color:#fff;background:linear-gradient(180deg,rgba(76,141,255,.22),rgba(143,128,238,.10))}
 #bnav button.on svg{stroke:var(--g1)}
 main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
 #top{padding-top:calc(10px + env(safe-area-inset-top))}
}
.btn{border:0;border-radius:11px;padding:9px 15px;background:var(--grad);color:#06101f;font-weight:650;cursor:pointer;font-size:13px;transition:transform .15s,filter .15s;width:max-content}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--bd2)}
.kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
/* ---------- Hoje ---------- */
body[data-page="hoje"]:after{content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;background:radial-gradient(700px 360px at 50% -60px,color-mix(in srgb,var(--rc,#4c8dff) 30%,transparent),transparent 70%);transition:background .6s}
.today{padding:24px 26px;border:1px solid transparent;background:radial-gradient(520px 260px at 0 0,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),linear-gradient(165deg,#162038,#10172a 70%) padding-box,linear-gradient(135deg,var(--rc),rgba(143,128,238,.5) 60%,rgba(255,255,255,.06)) border-box}
.today h2{margin:2px 0 6px;font-size:30px;letter-spacing:-.025em;line-height:1.1}
.today .tdh p{margin:0;color:var(--tx2);font-size:15px;max-width:720px}
.tdb{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-top:18px}
.bring{display:block;width:200px;height:200px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
.rcs{display:grid;gap:12px;min-width:0}
.rc{display:grid;grid-template-columns:128px 1fr auto;gap:4px 12px;align-items:center}
.rc span{font-size:13px;color:var(--tx2)}.rc b{font-size:13.5px;text-align:right;white-space:nowrap}
.rc small{grid-column:2/4;color:var(--mu);font-size:11.5px;margin-top:-3px}
.rb{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.rb i{display:block;height:100%;border-radius:99px;animation:bar 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes bar{from{width:0!important}}
.tw{padding:20px 22px;display:grid;gap:10px;align-content:start;border:1px solid transparent;background:radial-gradient(420px 200px at 100% 0,color-mix(in srgb,var(--k,#4c8dff) 22%,transparent),transparent 70%),linear-gradient(165deg,#172038,#111829) padding-box,linear-gradient(135deg,var(--k,#4c8dff),rgba(255,255,255,.06) 60%) border-box}
.tw.done{--k:#22d3c5}
.tw h3,.lastc h3,.goal h3{margin:0;font-size:21px;letter-spacing:-.015em;line-height:1.25}

<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5, MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const toMs=d=>Date.parse(d+'T00:00:00Z');
const fmtP=s=>{if(s==null||!isFinite(s))return'—';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const f1=(v,d=1)=>v==null||!isFinite(v)?'—':v.toFixed(d).replace('.',',');
const fmtD=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2)};
const fmtM=ms=>{const d=new Date(ms);return MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2)};
const fmtDM=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+MES[d.getUTCMonth()]};
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:null;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pearson=(x,y)=>{const n=x.length;if(n<4)return null;const mx=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null};
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const weekStart=ms=>ms-((new Date(ms).getUTCDay()+6)%7)*DAY;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
/* paleta validada (superfície #131a2c): categórica em ordem fixa, zonas, neutro de comparação */
const C=['#4c8dff','#e06a30','#17a593','#bd8610','#d9588f','#8f80ee'];
const ZC=['#4c8dff','#17a593','#bd8610','#8f80ee','#e06a30'];
const NEU='#66748f';
const CATC={'Prova':'#e66767','Intervalado':'#e06a30','Limiar/Ritmo':'#bd8610','Progressivo':'#d9588f','Longo':'#8f80ee','Rodagem':'#4c8dff','Leve':'#17a593','Esteira':'#7d88a4','Teste':'#c9a05a','Curto':'#55627f'};
const pill=(k,extra='')=>`<span class="pill"><i style="background:${CATC[k]||NEU}"></i>${k}${extra}</span>`;

/* ============ dados ============ */
let ACTS=[],REC={m:[],r:[],k:{}},SRC='Garmin Connect (sync automático)';
const S={page:'hoje',lall:'1',lt:'',range:'12m',hrmax:190,hrrest:45,cat:'',q:'',sort:'ms',desc:true,all:false,cmp:'28d',race:'',xrace:'',dpw:5,goal:{d:'10k',t:'38:30',date:''}};

function classify(a){const t=norm(a.title);
 if(/simulador/.test(t))return'Limiar/Ritmo';
 if(a.km>40||/\bprova\b|corrida 10k|circuito caixa|fau run|meia maratona|10 milhas|desafio do parque|live run|zumbi|bahamas|santander|sunset|integracao|super maxi|trabalhador|corrida abc|10k - abc|abc uberlandia|supermercado/.test(t))return'Prova';
 if(/teste de ritmo/.test(t))return'Limiar/Ritmo';
 if(/teste/.test(t))return'Teste';
 if(/interval|tiro|\d\s*x\s*\d|fartlek|sub20/.test(t))return'Intervalado';
 if(/limiar|continuo|ritmo cont|treino-chave|taper|polimento|\bpre\b/.test(t))return'Limiar/Ritmo';
 if(/progress/.test(t))return'Progressivo';
 if(a.km>=14||/long/.test(t))return'Longo';
 if(/regenerativo|leve|soltura|recupera/.test(t))return'Leve';
 if(a.ty==='T'){const fast=a.laps.filter(l=>l.km>=.9&&l.sec<240).length;return fast>=3?'Intervalado':'Esteira'}
 if(a.km<3.6)return'Curto';
 return'Rodagem'}
function prep(rows){return rows.map(r=>{const f=r[8]||[],laps=[];for(let i=0;i+2<f.length;i+=3)laps.push({km:f[i],sec:f[i+1],hr:f[i+2]});
 const a={d:r[0],t:r[1],ty:r[2],title:r[3],km:r[4],sec:r[5],hr:r[6],hrmax:r[7],laps,ms:toMs(r[0])};a.pace=a.sec/a.km;a.cat=classify(a);return a}).sort((x,y)=>y.ms-x.ms||(y.t>x.t?1:-1))}
function loadRaw(raw){ACTS=prep(raw.a);OTH=typeof prepO==='function'?prepO(raw.o):[];const XX=raw.x||{};ACTS.forEach(a=>{const e=XX[a.d+' '+a.t];if(e)a.x=e});WX=raw.we||{d:[],w:[]};REC={m:raw.m||[],r:(raw.r||[]).map(r=>({ms:toMs(r[0]),d:r[0],sl:r[1],vfc:r[2],bb:r[3]})).sort((a,b)=>a.ms-b.ms),k:raw.k||{}};if(raw.src)SRC=raw.src}
const NOW=()=>{const t=new Date();return Math.max(toMs(new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,10)),ACTS.length?ACTS[0].ms:0)};
const sinceMs=()=>({all:0,'12m':NOW()-364*DAY,'6m':NOW()-182*DAY,'90d':NOW()-89*DAY,'30d':NOW()-29*DAY})[S.range];

/* ============ fisiologia ============ */
const hrr=hr=>Math.max(0,Math.min(1,(hr-S.hrrest)/(S.hrmax-S.hrrest)));
const zoneOf=hr=>{const r=hrr(hr);return r<.6?0:r<.7?1:r<.8?2:r<.9?3:4};
const tr1=(sec,hr)=>{const r=hrr(hr);return sec/60*r*.64*Math.exp(1.92*r)};
function trimp(a){const L=a.laps.filter(l=>l.hr!=null);const cov=sum(L.map(l=>l.sec));
 if(L.length&&cov>=.8*a.sec)return sum(L.map(l=>tr1(l.sec,l.hr)));return tr1(a.sec,a.hr)}
function zoneSec(a){const z=[0,0,0,0,0];const L=a.laps.filter(l=>l.hr!=null);const cov=sum(L.map(l=>l.sec));
 if(L.length&&cov>=.8*a.sec){L.forEach(l=>z[zoneOf(l.hr)]+=l.sec)}else z[zoneOf(a.hr)]+=a.sec;return z}
const isEasy=a=>['Rodagem','Leve','Longo'].includes(a.cat)&&a.ty!=='T'&&a.km>=4.5&&a.hr>=110&&a.hr<=172;
const EF=a=>(a.km*1000/(a.sec/60))/a.hr;

/* ============ gráficos (SVG puro) ============ */
const CW=()=>innerWidth<700?460:760;
let GID=0;const gid=()=>'g'+(++GID);
const gradV=(id,c,o1=.42,o2=0)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity="${o1}"/><stop offset="1" stop-color="${c}" stop-opacity="${o2}"/></linearGradient>`;
function nice(lo,hi,n=5){if(hi===lo)hi=lo+1;const st0=(hi-lo)/n,mag=10**Math.floor(Math.log10(st0)),r=st0/mag,st=(r<1.5?1:r<3?2:r<7?5:10)*mag;
 const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return t}
function frame(w,h,m){return{w,h,m,iw:w-m.l-m.r,ih:h-m.t-m.b}}
function yGrid(F,sc,ticks,fmt){return ticks.map(v=>`<line x1="${F.m.l}" x2="${F.w-F.m.r}" y1="${sc(v)}" y2="${sc(v)}" stroke="#232d45" stroke-width="1"/><text x="${F.m.l-7}" y="${sc(v)+3.5}" text-anchor="end">${fmt(v)}</text>`).join('')}
function xTicksT(F,x,x0,x1,fmt=fmtM,k=6){let s='';for(let i=0;i<=k;i++){const v=x0+(x1-x0)*i/k;s+=`<text x="${x(v)}" y="${F.h-F.m.b+17}" text-anchor="${i==0?'start':i==k?'end':'middle'}">${fmt(v)}</text>`}return s}
const tipA=h=>` data-tip="${esc(h)}"`;
const legend=(items)=>items.length>1?`<div class="lg">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`:'';
const noData='<p class="note">Sem dados no período.</p>';

function lineChart({xs,series,w=CW(),h=230,yfmt=v=>v,ymin,ymax,xfmt=fmtM,tip,refs=[],ticksN=5,xk=6,endLabels=false}){
 const F=frame(w,h,{l:46,r:endLabels?44:14,t:12,b:26});const vals=series.flatMap(s=>s.vals.filter(v=>v!=null)).concat(refs.map(r=>r.v));
 if(!vals.length)return noData;
 let lo=ymin??Math.min(...vals),hi=ymax??Math.max(...vals);const tk=nice(lo,hi,ticksN);lo=ymin??tk[0];hi=ymax??tk[tk.length-1];
 const x0=xs[0],x1=xs[xs.length-1]||x0+1;const x=v=>F.m.l+(x1===x0?F.iw/2:(v-x0)/(x1-x0)*F.iw),y=v=>F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
 let defs='',s=yGrid(F,y,tk.filter(v=>v>=lo-1e-9&&v<=hi+1e-9),yfmt)+xTicksT(F,x,x0,x1,xfmt,xk);
 refs.forEach(r=>s+=`<line x1="${F.m.l}" x2="${w-F.m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c||NEU}" stroke-dasharray="4 4"/><text x="${w-F.m.r}" y="${y(r.v)-4}" text-anchor="end">${esc(r.t)}</text>`);
 series.forEach(se=>{const segs=[];let cur=null;se.vals.forEach((v,i)=>{if(v==null||xs[i]==null){cur=null;return}if(!cur){cur=[];segs.push(cur)}cur.push([x(xs[i]),y(v)])});
  const base=F.m.t+F.ih;
  segs.forEach(g=>{const d=g.length>=4&&!se.raw?mono(g):g.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
   if(se.area&&g.length>1){const id=gid();defs+=gradV(id,se.c,se.areaO||.38,0);s+=`<path d="${d}L${g[g.length-1][0].toFixed(1)} ${base}L${g[0][0].toFixed(1)} ${base}Z" fill="url(#${id})"/>`}
   s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.sw||2}" stroke-linejoin="round" stroke-linecap="round"${se.dash?' stroke-dasharray="5 4"':' class="ln" pathLength="1"'}${se.op?` opacity="${se.op}"`:''} style="--c:${se.c}"/>`;
   if(endLabels&&se.n&&g===segs[segs.length-1]){const p=g[g.length-1];s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${se.c}" class="pt"/><text class="dl2" x="${(p[0]+8).toFixed(1)}" y="${(p[1]+4).toFixed(1)}">${esc(se.n)}</text>`}});
  if(xs.length<=40&&!se.nodots)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(xs[i]).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="${se.c}" class="pt"/>`})});
 const n=xs.length;xs.forEach((xv,i)=>{const a=i?(x(xs[i-1])+x(xv))/2:F.m.l,b=i<n-1?(x(xv)+x(xs[i+1]))/2:w-F.m.r;
  s+=`<rect class="hit" x="${a.toFixed(1)}" y="${F.m.t}" width="${Math.max(1,b-a).toFixed(1)}" height="${F.ih}"${tipA(tip(i))}/>`});

const barPath=(bx,ww,yt,yb)=>{const hh=Math.max(0,yb-yt),r=Math.min(4,ww/2,hh);return`M${bx.toFixed(1)} ${yb}V${(yt+r).toFixed(1)}Q${bx.toFixed(1)} ${yt.toFixed(1)} ${(bx+r).toFixed(1)} ${yt.toFixed(1)}H${(bx+ww-r).toFixed(1)}Q${(bx+ww).toFixed(1)} ${yt.toFixed(1)} ${(bx+ww).toFixed(1)} ${(yt+r).toFixed(1)}V${yb}Z`};

function inR(a){return a.ms>=sinceMs()}
function weeklyAll(){const wk=new Map();for(const a of ACTS){const w=weekStart(a.ms);const o=wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]};
  o.km+=a.km;o.sec+=a.sec;o.n++;o.days.add(a.d);o.load+=trimp(a);zoneSec(a).forEach((v,i)=>o.z[i]+=v);wk.set(w,o)}
 const first=Math.min(...wk.keys()),last=weekStart(NOW()),out=[];for(let w=first;w<=last;w+=7*DAY)out.push(wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]});return out}
function loadSeries(){const m=new Map();for(const a of ACTS)m.set(a.ms,(m.get(a.ms)||0)+trimp(a));if(S.lall!=='0')for(const o of OTH)if(o.ms>=(ACTS.length?ACTS[ACTS.length-1].ms:0))m.set(o.ms,(m.get(o.ms)||0)+o.tr);
 const start=Math.min(...ACTS.map(a=>a.ms)),end=NOW();const o={xs:[],ctl:[],atl:[],tsb:[],ld:[]};let c=0,t=0;
 for(let d=start;d<=end;d+=DAY){const l=m.get(d)||0,tsb=c-t;c+=(l-c)/42;t+=(l-t)/7;o.xs.push(d);o.ctl.push(c);o.atl.push(t);o.tsb.push(tsb);o.ld.push(l)}return o}
const win=(from,to)=>ACTS.filter(a=>a.ms>=from&&a.ms<=to);
function monthlyAgg(list){const m=new Map();for(const a of list){const k=a.d.slice(0,7);const o=m.get(k)||{k,km:0,n:0,sec:0};o.km+=a.km;o.n++;o.sec+=a.sec;m.set(k,o)}return[...m.values()].sort((a,b)=>a.k<b.k?-1:1)}
const keyOf=t=>{t=norm(t);return['desafio do parque','fau run','live run','abc','nilson lima','10 milhas','circuito','zumbi'].find(k=>t.includes(k))||null};
function gapsList(){const asc=[...ACTS].sort((a,b)=>a.ms-b.ms),g=[];for(let i=1;i<asc.length;i++){const d=(asc[i].ms-asc[i-1].ms)/DAY;if(d>21)g.push([asc[i-1].ms,asc[i].ms,Math.round(d)])}return g}
const movAvg=(arr,k)=>arr.map((v,i)=>{const w=arr.slice(Math.max(0,i-k+1),i+1).filter(x=>x!=null);return w.length>=Math.ceil(k/2)?mean(w):null});
/* estatísticas de uma janela [from,to] — base dos comparativos */
function stats(from,to){const L=win(from,to),km=sum(L.map(a=>a.km)),sec=sum(L.map(a=>a.sec)),days=new Set(L.map(a=>a.d)).size,span=Math.round((to-from)/DAY)+1;
 const z=[0,0,0,0,0];L.forEach(a=>zoneSec(a).forEach((s,k)=>z[k]+=s));const zt=sum(z);const e=L.filter(isEasy),rr=REC.r.filter(r=>r.ms>=from&&r.ms<=to);
 const sl=rr.map(r=>r.sl).filter(v=>v!=null),vf=rr.map(r=>r.vfc).filter(v=>v!=null);
 return{from,to,L,n:L.length,km,sec,days,span,dpw:days/(span/7),pace:km?sec/km:null,hr:sec?sum(L.map(a=>a.hr*a.sec))/sec:null,load:sum(L.map(trimp)),long:L.length?Math.max(...L.map(a=>a.km)):null,
  easy:zt?(z[0]+z[1])/zt*100:null,hard:zt?(z[3]+z[4])/zt*100:null,ne:e.length,ef:e.length>=3?median(e.map(EF)):null,epace:e.length>=3?median(e.map(a=>a.pace)):null,ehr:e.length>=3?median(e.map(a=>a.hr)):null,
  sl:sl.length>=3?mean(sl):null,vfc:vf.length>=3?mean(vf):null,nr:rr.length}}

function assess(){const N=NOW(),ev=[];const add=(sev,tag,title,text)=>ev.push({sev,tag,title,text});
 const w28=win(N-27*DAY,N),p28=win(N-55*DAY,N-28*DAY),b84=win(N-139*DAY,N-56*DAY);
 const v=sum(w28.map(a=>a.km)),vp=sum(p28.map(a=>a.km)),vb=sum(b84.map(a=>a.km))/3;
 const pct=vp?(v-vp)/vp*100:null;
 add(pct!=null&&Math.abs(pct)>35?'warn':'ok',pct==null?'—':(pct>=0?'+':'')+f1(pct,0)+'%','Volume (28 dias)',
  `${f1(v)} km em ${w28.length} treinos, contra ${f1(vp)} km nos 28 dias anteriores e média de ${f1(vb)} km por bloco de 28 dias nas 12 semanas antes disso. ${pct!=null&&pct>35?'Salto grande de volume: vale segurar a progressão.':pct!=null&&pct<-35?'Volume bem abaixo do recente (polimento ou queda de ritmo de treino).':'Variação dentro de uma faixa normal.'}`);
 const L=loadSeries(),i=L.xs.length-1,ctl=L.ctl[i],atl=L.atl[i],tsb=L.tsb[i];
 const a7=sum(L.ld.slice(-7)),c28=sum(L.ld.slice(-28))/4,acwr=c28?a7/c28:null;
 const sevL=acwr==null?'info':acwr>1.5?'bad':acwr>1.3?'warn':acwr<.8?'warn':'ok';
 add(sevL,acwr==null?'—':'ACWR '+f1(acwr,2),'Carga de treino',`Forma (CTL, 42d) ${f1(ctl,0)} · fadiga (ATL, 7d) ${f1(atl,0)} · equilíbrio (TSB) ${f1(tsb,0)}. Carga aguda/crônica ${f1(acwr,2)} (faixa 0,8–1,3 costuma ser a mais segura). ${acwr!=null&&acwr<.8?'Carga recente baixa (esperado após prova ou semana leve). ':''}${tsb>5?'Você está descansado: bom momento para uma sessão-chave ou prova.':tsb<-20?'Fadiga acumulada alta: priorize sono e treinos leves.':'Equilíbrio neutro entre forma e fadiga.'}`);
 const W=weeklyAll(),cw=W.slice(-9,-1);const dpw=mean(cw.map(w=>w.days.size)),zero=cw.filter(w=>w.n===0).length;
 add(dpw>=4?'ok':dpw>=3?'info':'warn',f1(dpw)+' dias/sem','Consistência (8 semanas completas)',`Média de ${f1(dpw)} dias corridos por semana e ${zero} semana(s) sem treino. Semanas: ${cw.map(w=>f1(w.km,0)).join(' · ')} km.`);
 const lg1=win(N-27*DAY,N).filter(a=>a.cat!=='Prova'||a.km>=10),lgA=Math.max(0,...lg1.map(a=>a.km)),lgB=Math.max(0,...win(N-83*DAY,N-28*DAY).map(a=>a.km));
 add('info',f1(lgA)+' km','Longão',`Maior corrida dos últimos 28 dias: ${f1(lgA)} km; nas 8 semanas anteriores: ${f1(lgB)} km. Maior corrida do histórico: ${f1(Math.max(...ACTS.map(a=>a.km)))} km.`);
 const zs=[0,0,0,0,0];w28.forEach(a=>zoneSec(a).forEach((s,k)=>zs[k]+=s));const zt=sum(zs)||1,easy=(zs[0]+zs[1])/zt*100,hard=(zs[3]+zs[4])/zt*100,mid=zs[2]/zt*100;
 add(hard>30?'warn':easy>=65?'ok':'info',f1(easy,0)+'% fácil','Distribuição de intensidade (28 dias)',`Z1+Z2 ${f1(easy,0)}% · Z3 ${f1(mid,0)}% · Z4+Z5 ${f1(hard,0)}% do tempo (zonas por FC de reserva, FCmáx ${S.hrmax}/repouso ${S.hrrest}). Referência 80/20: ~75–80% fácil. ${hard>30?'Muito tempo em intensidade alta: risco de acumular fadiga.':mid>35?'Muito tempo na zona cinza (Z3): fácil fica rápido demais e o forte não sai forte.':'Distribuição saudável.'}`);
 const e1=win(N-55*DAY,N).filter(isEasy),e0=win(N-111*DAY,N-56*DAY).filter(isEasy);
 if(e1.length>=4&&e0.length>=4){const a=median(e1.map(EF)),b=median(e0.map(EF)),d=(a/b-1)*100;
  add(d>=1.5?'ok':d<=-1.5?'warn':'info',(d>=0?'+':'')+f1(d)+'%','Eficiência aeróbica',`Em rodagens fáceis, a eficiência (ritmo ÷ FC) variou ${d>=0?'+':''}${f1(d)}% nas últimas 8 semanas vs as 8 anteriores. Ritmo mediano ${fmtP(median(e1.map(x=>x.pace)))}/km a ${f1(median(e1.map(x=>x.hr)),0)} bpm, antes ${fmtP(median(e0.map(x=>x.pace)))}/km a ${f1(median(e0.map(x=>x.hr)),0)} bpm. ${d>=1.5?'Sinal de adaptação positiva.':d<=-1.5?'Piora: calor, sono ruim ou fadiga podem explicar.':'Estável.'}`)}
 const races=ACTS.filter(a=>a.cat==='Prova');const lr=races[0];
 if(lr){const k=keyOf(lr.title);const prev=k?races.find(r=>r!==lr&&keyOf(r.title)===k&&Math.abs(r.km-lr.km)<.4&&r.ms<lr.ms&&lr.ms-r.ms<420*DAY):null;
  add('info',fmtT(lr.sec),'Última prova',`${esc(lr.title)} (${fmtD(lr.ms)}): ${f1(lr.km,2)} km em ${fmtT(lr.sec)} (${fmtP(lr.pace)}/km), FC ${lr.hr}/${lr.hrmax}.`+(prev?` Mesma prova em ${fmtD(prev.ms)}: ${fmtT(prev.sec)} (${prev.sec>lr.sec?'-':'+'}${Math.abs(Math.round(lr.sec-prev.sec))}s hoje), FC ${prev.hr}/${prev.hrmax}.`:''))}
 const mm=REC.m;if(mm.length>14){const g=(a,b,j)=>mean(mm.slice(a,b).map(r=>r[j]).filter(v=>v!=null));
  const sh=g(1,4,1),sh0=g(13,16,1),ss=g(1,4,2),ss0=g(13,16,2);const k=REC.k||{};
  const hv=mean(mm.slice(1,13).map(r=>r[3])),rh=median(mm.slice(1,13).map(r=>r[6]));
  const okHrv=k.vfc==null||k.vfc7==null||k.vfc>=k.vfc7*.92,okRhr=k.fcr==null||k.fcr<=rh+3;
  add(okHrv&&okRhr&&(sh>=6.5)?'ok':'warn',k.vfc!=null?`VFC ${k.vfc} ms`:'—','Recuperação',`${k.vfc!=null?`VFC noturna ${k.vfc} ms (média 7d ${k.vfc7}; média mensal 12m ${f1(hv,0)}). FC de repouso ${k.fcr} bpm (mediana 12m ${f1(rh,0)}). `:''}Sono médio dos últimos 3 meses: ${f1(sh)} h / score ${f1(ss,0)}, contra ${f1(sh0)} h / ${f1(ss0,0)} no mesmo período de um ano atrás${sh0-sh>.4?' — queda relevante de sono, o ponto mais fraco da recuperação':''}.`)}
 return ev}

/* índice do painel: heurística própria (não é métrica Garmin), 5 componentes de 0 a 100 */
function scoreIndex(){const N=NOW(),out=[];
 const W=weeklyAll(),cw=W.slice(-9,-1),dpw=mean(cw.map(w=>w.days.size))||0,zero=cw.filter(w=>w.n===0).length;
 out.push({n:'Consistência',v:clamp(dpw/5*100-zero*10),t:`${f1(dpw)} dias/sem nas últimas 8 semanas`});
 const L=loadSeries(),a7=sum(L.ld.slice(-7)),c28=sum(L.ld.slice(-28))/4,ac=c28?a7/c28:null;
 if(ac!=null)out.push({n:'Carga',v:clamp(ac>=.8&&ac<=1.3?100:ac<.8?40+ac/.8*60:100-(ac-1.3)/.5*80),t:`carga aguda/crônica ${f1(ac,2)} (ideal 0,8–1,3)`});
 const zs=[0,0,0,0,0];win(N-27*DAY,N).forEach(a=>zoneSec(a).forEach((s,k)=>zs[k]+=s));const zt=sum(zs);
 if(zt){const easy=(zs[0]+zs[1])/zt*100,hard=(zs[3]+zs[4])/zt*100;out.push({n:'Intensidade',v:clamp(100-Math.max(0,70-easy)*1.5-Math.max(0,hard-25)*3),t:`${f1(easy,0)}% do tempo em zona fácil (28 dias)`})}
 const e1=win(N-55*DAY,N).filter(isEasy),e0=win(N-111*DAY,N-56*DAY).filter(isEasy);
 if(e1.length>=4&&e0.length>=4){const d=(median(e1.map(EF))/median(e0.map(EF))-1)*100;out.push({n:'Eficiência',v:clamp(60+d*10),t:`${d>=0?'+':''}${f1(d)}% em 8 semanas nas rodagens fáceis`})}
 const k=REC.k||{},mm=REC.m;if(k.vfc!=null&&mm.length>4){const rh=median(mm.slice(1,13).map(r=>r[6])),sh=mean(mm.slice(1,4).map(r=>r[1]).filter(v=>v!=null));let v=100;
  if(k.vfc7!=null&&k.vfc<k.vfc7*.92)v-=25;if(k.fcr!=null&&rh!=null&&k.fcr>rh+3)v-=25;if(sh!=null&&sh<6)v-=40;else if(sh!=null&&sh<6.5)v-=25;else if(sh!=null&&sh<7)v-=10;
  out.push({n:'Recuperação',v:clamp(v),t:`VFC ${k.vfc} ms · sono médio ${f1(sh)} h (3 meses)`})}
 return{parts:out,total:mean(out.map(o=>o.v))||0}}

function pgResumo(){const N=NOW(),ix=scoreIndex(),A=stats(N-27*DAY,N),B=stats(N-55*DAY,N-28*DAY);
 const lab=ix.total>=80?'Muito bom momento':ix.total>=65?'Bom momento':ix.total>=50?'Atenção em alguns pontos':'Momento de cuidado';
 const sorted=[...ix.parts].sort((a,b)=>b.v-a.v),best=sorted[0],worst=sorted[sorted.length-1];
 const hero=`<div class="card hero"><div class="heroin">${ring(ix.total)}<div style="min-width:0;width:100%"><h3>${lab}</h3>
 <p>${best?`Ponto mais forte: <b>${best.n.toLowerCase()}</b> — ${best.t}.`:''} ${worst&&worst!==best&&worst.v<80?`Ponto de atenção: <b>${worst.n.toLowerCase()}</b> — ${worst.t}.`:''}</p>
 <div class="comp">${ix.parts.map(p=>`<div class="cp"><span>${p.n}</span><div class="trk"><i style="width:${p.v.toFixed(0)}%"></i></div><b>${p.v.toFixed(0)}</b><small>${p.t}</small></div>`).join('')}</div>
 <p class="note">Índice próprio deste painel (média dos componentes acima), não é uma métrica do Garmin. Serve para acompanhar a tendência, não como diagnóstico.</p></div></div></div>`;
 const W=weeklyAll(),w16=W.slice(-16),L=loadSeries(),li=L.xs.length-1;
 const E1=stats(N-55*DAY,N),E0=stats(N-111*DAY,N-56*DAY);
 const er=ACTS.filter(isEasy).slice(0,24).reverse().map(EF);
 const r7=REC.r.filter(r=>r.ms>N-7*DAY),r28=REC.r.filter(r=>r.ms<=N-7*DAY&&r.ms>N-35*DAY),r60=REC.r.filter(r=>r.ms>N-60*DAY);
 const av=(a,f)=>mean(a.map(r=>r[f]).filter(v=>v!=null));
 const kp=`<div class="grid kpis mt">
 ${kpiCard('Distância · 28 dias',f1(A.km,0)+' <small>km</small>',`antes: ${f1(B.km,0)} km`,delta(A.km,B.km),spark(w16.map(w=>w.km),C[0]))}
 ${kpiCard('Dias corridos por semana',f1(A.dpw),`antes: ${f1(B.dpw)}`,delta(A.dpw,B.dpw,{dir:1,mode:'abs',unit:' d'}),spark(w16.map(w=>w.days.size),C[2]))}
 ${kpiCard('Forma (CTL)',f1(L.ctl[li],0),`há 28 dias: ${f1(L.ctl[li-28],0)}`,delta(L.ctl[li],L.ctl[li-28]),spark(L.ctl.slice(-90),C[5]))}
 ${kpiCard('Eficiência nas fáceis',f1(E1.ef,2),E1.epace?`${fmtP(E1.epace)}/km a ${f1(E1.ehr,0)} bpm`:'poucas rodagens',delta(E1.ef,E0.ef,{dir:1,tol:1}),spark(movAvg(er,3),C[2]))}
 ${kpiCard('VFC · média 7 dias',f1(av(r7,'vfc'),0)+' <small>ms</small>',`28 dias antes: ${f1(av(r28,'vfc'),0)} ms`,delta(av(r7,'vfc'),av(r28,'vfc'),{dir:1,mode:'abs',dec:0,unit:' ms',tol:2}),spark(movAvg(r60.map(r=>r.vfc),7),C[0]))}
 ${kpiCard('Sono · score 7 dias',f1(av(r7,'sl'),0),`28 dias antes: ${f1(av(r28,'sl'),0)}`,delta(av(r7,'sl'),av(r28,'sl'),{dir:1,mode:'abs',dec:0,unit:' pts',tol:2}),spark(movAvg(r60.map(r=>r.sl),7),C[5]))}</div>`;
 const ma=W.map((w,i)=>i>=3?mean(W.slice(i-3,i+1).map(x=>x.km)):null).slice(-16);
 const wk=barChart({cats:w16.map(w=>w.w),vals:w16.map(w=>w.km),labels:w16.map(w=>fmtDM(w.w)),line:ma,tip:i=>`<b>Semana de ${fmtD(w16[i].w)}</b><br>${f1(w16[i].km)} km · ${w16[i].n} treinos · ${w16[i].days.size} dias<br>Média 4 sem: ${f1(ma[i])} km`});
 const xs=L.xs.slice(-120),ct=L.ctl.slice(-120),at=L.atl.slice(-120);
 const ld=lineChart({xs,series:[{n:'Forma (CTL)',c:C[0],vals:ct,area:true},{n:'Fadiga (ATL)',c:C[1],vals:at}],xfmt:fmtDM,tip:i=>`<b>${fmtD(xs[i])}</b><br>Forma CTL ${f1(ct[i],0)}<br>Fadiga ATL ${f1(at[i],0)}<br>Equilíbrio ${f1(ct[i]-at[i],0)}`,yfmt:v=>f1(v,0)});
 const ev=assess(),ic={ok:'✓',warn:'▲',bad:'✕',info:'●'};
 return hero+kp+`<div class="grid g2 mt">${card('Quilômetros por semana','Últimas 16 semanas · linha = média móvel de 4 semanas',wk,legend([['km/semana',C[0]],['média 4 sem',C[1]]]))}
 ${card('Forma × fadiga','Últimos 120 dias · forma sobe devagar, fadiga reage rápido',ld,legend([['Forma (CTL)',C[0]],['Fadiga (ATL)',C[1]]]))}</div>
 ${sech('Avaliação ponto a ponto')}<div class="ev">${ev.map(e=>`<div class="card ${e.sev}"><h4><span>${ic[e.sev]}</span>${e.title}<span class="badge">${e.tag}</span></h4><p>${e.text}</p></div>`).join('')}</div>`}

function cmpPresets(){const N=NOW(),d=new Date(N),y=d.getUTCFullYear(),m=d.getUTCMonth(),dd=d.getUTCDate(),U=(a,b,c)=>Date.UTC(a,b,c);
 return{
 '28d':{t:'28 dias',la:'Últimos 28 dias',lb:'28 dias anteriores',A:[N-27*DAY,N],B:[N-55*DAY,N-28*DAY]},
 '90d':{t:'90 dias',la:'Últimos 90 dias',lb:'90 dias anteriores',A:[N-89*DAY,N],B:[N-179*DAY,N-90*DAY]},
 'mes':{t:'Mês × mês passado',la:'Este mês (até hoje)',lb:'Mês passado (até o mesmo dia)',A:[U(y,m,1),N],B:[U(y,m-1,1),Math.min(U(y,m-1,dd),U(y,m,0))]},
 'mesano':{t:'Mês × ano passado',la:'Este mês (até hoje)',lb:'Mesmo mês do ano passado',A:[U(y,m,1),N],B:[U(y-1,m,1),U(y-1,m,dd)]},
 'ano':{t:'Ano × ano passado',la:y+' (até hoje)',lb:(y-1)+' (até a mesma data)',A:[U(y,0,1),N],B:[U(y-1,0,1),U(y-1,m,dd)]},
 '12m':{t:'12 meses',la:'Últimos 12 meses',lb:'12 meses anteriores',A:[N-364*DAY,N],B:[N-729*DAY,N-365*DAY]}}}
function cmpCard(label,a,b,fmt,o={}){const bars=o.bars!==false,mx=Math.max(a||0,b||0)||1,pc=v=>v==null?0:clamp(v/mx*100);
 const row=(tg,v,cls)=>bars?`<div class="cr"><span class="tg ${tg==='B'?'b':''}">${tg}</span><div class="trk"><i class="${cls}" style="width:${pc(v).toFixed(1)}%"></i></div><b>${v==null?'—':fmt(v)}</b></div>`
  :`<div class="cr big"><span class="tg ${tg==='B'?'b':''}">${tg}</span><b>${v==null?'—':fmt(v)}</b></div>`;
 return`<div class="card cmp"><div class="hd"><h4>${label}</h4>${delta(a,b,o)}</div>${row('A',a,'fa')}${row('B',b,'fb')}${o.note?`<p class="note">${o.note}</p>`:''}</div>`}
function cumul(st){const m=new Map();st.L.forEach(a=>m.set(a.ms,(m.get(a.ms)||0)+a.km));const out=[];let c=0;for(let d=st.from;d<=st.to;d+=DAY){c+=m.get(d)||0;out.push(c)}return out}

function pgComparativos(){const P=cmpPresets(),p=P[S.cmp]||P['28d'],A=stats(...p.A),B=stats(...p.B),N=NOW();
 const rngT=s=>`${fmtD(s.from)} a ${fmtD(s.to)}`;
 const gap=gapsList().filter(g=>Math.min(g[1],B.to)-Math.max(g[0],B.from)>=14*DAY);
 const head=`<div class="seg" id="cmpseg">${Object.entries(P).map(([k,v])=>`<button data-c="${k}" class="${S.cmp===k?'on':''}">${v.t}</button>`).join('')}</div>
 <div class="abl"><span><span class="tg">A</span><b>${p.la}</b> · ${rngT(A)}</span><span><span class="tg b">B</span><b>${p.lb}</b> · ${rngT(B)}</span></div>
 ${gap.length?`<p class="note" style="margin:-6px 0 14px">▲ Atenção: o período B inclui uma lacuna sem registros (${gap.map(g=>fmtD(g[0])+' → '+fmtD(g[1])).join('; ')}). O volume de B está subestimado.</p>`:''}`;
 const k0=v=>f1(v,0),k1=v=>f1(v,1);
 const vol=`<div class="grid g4">
 ${cmpCard('Distância',A.km,B.km,v=>k0(v)+' km')}

 ${cmpCard('Dias corridos por semana',A.dpw,B.dpw,k1,{dir:1,mode:'abs',unit:' d'})}
 ${cmpCard('Tempo correndo',A.sec/3600,B.sec/3600,v=>k1(v)+' h')}
 ${cmpCard('Carga (TRIMP)',A.load,B.load,k0)}
 ${cmpCard('Maior corrida',A.long,B.long,v=>k1(v)+' km')}
 ${cmpCard('Ritmo médio geral',A.pace,B.pace,v=>fmtP(v)+'/km',{bars:false,mode:'pace',note:'Depende do tipo de treino feito no período; não é sinal de forma por si só.'})}
 ${cmpCard('FC média geral',A.hr,B.hr,v=>k0(v)+' bpm',{bars:false,mode:'abs',dec:0,unit:' bpm'})}</div>`;
 const qual=`<div class="grid g4">
 ${cmpCard('Eficiência nas rodagens fáceis',A.ef,B.ef,v=>f1(v,2),{bars:false,dir:1,tol:1,note:`Velocidade ÷ FC. Base: ${A.ne} treinos em A, ${B.ne} em B.`})}
 ${cmpCard('Ritmo nas rodagens fáceis',A.epace,B.epace,v=>fmtP(v)+'/km',{bars:false,mode:'pace',dir:-1,note:'Mediana. Menor = mais rápido.'})}
 ${cmpCard('FC nas rodagens fáceis',A.ehr,B.ehr,v=>k0(v)+' bpm',{bars:false,mode:'abs',dec:0,unit:' bpm',note:'Leia junto com o ritmo: mesma FC com ritmo melhor é evolução.'})}
 ${cmpCard('Tempo em zona fácil (Z1+Z2)',A.easy,B.easy,v=>k0(v)+'%',{mode:'abs',dec:0,unit:' pp',note:'Referência 80/20: 75–80%.'})}
 ${cmpCard('Sono · score médio',A.sl,B.sl,k0,{bars:false,dir:1,mode:'abs',dec:0,unit:' pts',tol:2,note:`${A.nr} noites em A, ${B.nr} em B.`})}
 ${cmpCard('VFC noturna média',A.vfc,B.vfc,v=>k0(v)+' ms',{bars:false,dir:1,mode:'abs',dec:0,unit:' ms',tol:2})}</div>`;
 const ca=cumul(A),cb=cumul(B),n=Math.max(ca.length,cb.length),xs=Array.from({length:n},(_,i)=>i);
 const cum=lineChart({xs,series:[{n:'B',c:NEU,vals:xs.map(i=>cb[i]??null),dash:true,nodots:true},{n:'A',c:C[0],vals:xs.map(i=>ca[i]??null),area:true,sw:2.5,nodots:true}],endLabels:true,h:260,
  xfmt:v=>'dia '+(Math.round(v)+1),yfmt:v=>f1(v,0),tip:i=>`<b>Dia ${i+1}</b><br>A (${i<ca.length?fmtD(A.from+i*DAY):'—'}): ${i<ca.length?f1(ca[i])+' km':'—'}<br>B (${i<cb.length?fmtD(B.from+i*DAY):'—'}): ${i<cb.length?f1(cb[i])+' km':'—'}${i<ca.length&&i<cb.length?`<br>Diferença: ${ca[i]-cb[i]>=0?'+':''}${f1(ca[i]-cb[i])} km`:''}`});
 /* por tipo */
 const cats=[...new Set([...A.L,...B.L].map(a=>a.cat))];const agg=(L,c)=>{const l=L.filter(a=>a.cat===c),km=sum(l.map(a=>a.km)),sec=sum(l.map(a=>a.sec));return{n:l.length,km,pace:km?sec/km:null,hr:sec?sum(l.map(a=>a.hr*a.sec))/sec:null}};
 const trs=cats.map(c=>({c,a:agg(A.L,c),b:agg(B.L,c)})).sort((x,y)=>(y.a.km+y.b.km)-(x.a.km+x.b.km)).map(r=>`<tr><td class="l">${pill(r.c)}</td><td>${r.a.n}</td><td>${f1(r.a.km,0)}</td><td>${fmtP(r.a.pace)}</td><td>${f1(r.a.hr,0)}</td><td>${r.b.n}</td><td>${f1(r.b.km,0)}</td><td>${fmtP(r.b.pace)}</td><td>${f1(r.b.hr,0)}</td><td>${r.a.pace&&r.b.pace?delta(r.a.pace,r.b.pace,{mode:'pace',dir:-1}):'—'}</td></tr>`).join('');
 const tipo=`<div class="sc" style="max-height:360px"><table><thead><tr><th class="l">Tipo</th><th>A · treinos</th><th>km</th><th>ritmo</th><th>FC</th><th>B · treinos</th><th>km</th><th>ritmo</th><th>FC</th><th>Δ ritmo</th></tr></thead><tbody>${trs}</tbody></table></div>`;
 /* ano contra ano */
 const years=[...new Set(ACTS.map(a=>+a.d.slice(0,4)))].sort(),yl=years[years.length-1],yc=y=>[C[0],C[1],C[2],C[5]][Math.min(3,yl-y)];
 const first=ACTS[ACTS.length-1].ms,dx=Array.from({length:365},(_,i)=>i);
 const ys=years.map(y=>{const s0=Date.UTC(y,0,1),m=new Map();ACTS.forEach(a=>{if(+a.d.slice(0,4)===y){const i=Math.min(364,Math.round((a.ms-s0)/DAY));m.set(i,(m.get(i)||0)+a.km)}});let c=0;
  return{n:String(y),c:yc(y),sw:y===yl?2.5:2,area:y===yl,nodots:true,vals:dx.map(i=>{const t=s0+i*DAY;c+=m.get(i)||0;return t<first-DAY||t>N?null:c})}});
 const yoy=lineChart({xs:dx,series:ys,endLabels:true,h:270,xk:11,xfmt:v=>MES[Math.min(11,Math.floor(v/30.5))],yfmt:v=>f1(v,0),
  tip:i=>{const d=new Date(Date.UTC(2025,0,1)+i*DAY);return`<b>${d.getUTCDate()} de ${MES[d.getUTCMonth()]}</b><br>`+ys.map(s=>`${s.n}: ${s.vals[i]==null?'—':f1(s.vals[i],0)+' km'}`).join('<br>')}});
 const mk=y=>MES.map((_,m)=>{const l=ACTS.filter(a=>a.d.slice(0,7)===y+'-'+String(m+1).padStart(2,'0'));return{km:sum(l.map(a=>a.km)),n:l.length}});
 const mA=mk(yl),mB=mk(yl-1),cm=new Date(N).getUTCMonth();
 const mon=groupBars({labels:MES,series:[{n:String(yl-1),c:NEU,vals:mB.map(x=>x.km)},{n:String(yl),c:C[0],vals:mA.map((x,i)=>i<=cm?x.km:0)}],yfmt:v=>f1(v,0),
  tip:i=>`<b>${MES[i]}</b><br>${yl}: ${i<=cm?f1(mA[i].km,0)+' km · '+mA[i].n+' treinos':'—'}<br>${yl-1}: ${f1(mB[i].km,0)} km · ${mB[i].n} treinos${i<=cm&&mB[i].km?`<br>Diferença: ${mA[i].km-mB[i].km>=0?'+':''}${f1(mA[i].km-mB[i].km,0)} km`:''}`});
 const tot=y=>sum(ACTS.filter(a=>+a.d.slice(0,4)===y).map(a=>a.km)),sameDate=sum(ACTS.filter(a=>+a.d.slice(0,4)===yl-1&&a.ms<=Date.UTC(yl-1,new Date(N).getUTCMonth(),new Date(N).getUTCDate())).map(a=>a.km));
 return head+sech('Volume e carga')+vol+sech('Qualidade e recuperação')+qual+
 `<div class="grid g2 mt">${card('Quilômetros acumulados: A × B','Os dois períodos alinhados pelo primeiro dia. Linha de cima = quem correu mais até aquele ponto.',cum,legend([['A · '+p.la,C[0]],['B · '+p.lb,NEU]]))}
 ${card('Por tipo de treino','Ritmo e FC de cada tipo nos dois períodos · Δ ritmo verde = A mais rápido',tipo)}</div>
 ${sech('Ano contra ano')}<div class="grid g2">
 ${card('Quilômetros acumulados no ano',`${yl}: ${f1(tot(yl),0)} km até hoje · ${yl-1}: ${f1(sameDate,0)} km até a mesma data (${f1(tot(yl-1),0)} km no ano todo)`,yoy,legend(ys.map(s=>[s.n,s.c]).reverse()))}

function repSessions(){const out=[];for(const a of ACTS){if(!['Intervalado','Limiar/Ritmo'].includes(a.cat)||!a.laps.length)continue;
  const reps=a.laps.filter(l=>l.km>=.35&&l.sec/l.km<=265);if(reps.length<3)continue;const pc=reps.map(l=>l.sec/l.km),hr=reps.map(l=>l.hr).filter(v=>v!=null);
  const med=median(reps.map(l=>l.km)),grp=med<.5?'400 m':med<.7?'600 m':med<.9?'800 m':'1 km';
  out.push({a,n:reps.length,grp,avg:mean(pc),best:Math.min(...pc),fade:(pc[pc.length-1]/pc[0]-1)*100,hr:mean(hr),hrmax:Math.max(...hr,0)})}
 return out}

 const gc={'400 m':C[4],'600 m':C[3],'800 m':C[2],'1 km':C[0]};

 const N=NOW(),grpCmp=Object.keys(gc).map(g=>{const k=all.filter(s=>s.grp===g),r1=k.filter(s=>s.a.ms>=N-59*DAY),r0=k.filter(s=>s.a.ms<N-59*DAY&&s.a.ms>=N-119*DAY);

 for(let k=0;k<nW;k++){const toRace=raceMs?nW-1-k:99,ws=start+k*7*DAY;let kind='build',km;

function mono(P){const n=P.length;if(n<3)return P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 const dx=[],s=[],t=[];for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];s[i]=dx[i]?(P[i+1][1]-P[i][1])/dx[i]:0}

 let s='',defs='',any=false;[210,240,270,300,330,360,390].forEach(t=>s+=`<line x1="${X(t)}" x2="${X(t)}" y1="6" y2="${h-22}" stroke="#1d2640"/><text x="${X(t)}" y="${h-6}" text-anchor="middle">${fmtP(t)}</text>`);

  const top=idx.map((i,j)=>[xs[i],y(hi[j])]),bot=idx.map((i,j)=>[xs[i],y(lo[j])]).reverse(),id=gid();defs+=gradV(id,ZC[k],.9,.55);
  s+=`<path d="${mono(top)}L${bot[0][0].toFixed(1)} ${bot[0][1].toFixed(1)}${mono(bot).replace(/^M[^C]*/,'')}Z" fill="url(#${id})" stroke="#131a2c" stroke-width="1.2"/>`;idx.forEach((_,j)=>acc[j]=hi[j])}
 ms.forEach((k,i)=>{if(i%2===0)s+=`<text x="${xs[i].toFixed(1)}" y="${h-8}" text-anchor="middle">${MES[+k.slice(5)-1]}/${k.slice(2,4)}</text>`;

  const A=p(a0,r0),B=p(a0,rr),Cc=p(a1,rr),D=p(a1,r0),col=i>=5&&i<=11?'#fab219':i>=12&&i<=17?'#e06a30':i>=18&&i<=21?'#4c8dff':'#8f80ee';
  if(v>0)s+=`<path d="M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${B[0].toFixed(1)} ${B[1].toFixed(1)}A${rr.toFixed(1)} ${rr.toFixed(1)} 0 0 1 ${Cc[0].toFixed(1)} ${Cc[1].toFixed(1)}L${D[0].toFixed(1)} ${D[1].toFixed(1)}A${r0} ${r0} 0 0 0 ${A[0].toFixed(1)} ${A[1].toFixed(1)}Z" fill="${col}" fill-opacity=".85"/>`;

/* ============ Hoje: prontidão, treino do dia, semana, progresso ============ */

const DAB=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],DLONG=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

const dLong=ms=>{const d=new Date(ms);return`${DLONG[d.getUTCDay()]}, ${d.getUTCDate()} de ${MLONG[d.getUTCMonth()]}`};

function readiness(){const N=NOW(),R=REC.r.filter(r=>r.ms<=N),L=loadSeries(),tsb=L.tsb[L.tsb.length-1],comp=[];

 const base=(k,n=30)=>{const v=R.filter(r=>last&&r.ms<last.ms&&r.ms>=last.ms-n*DAY&&r[k]!=null).map(r=>r[k]);return v.length>=7?median(v):null};
 if(fresh&&last.vfc!=null){const b=base('vfc');if(b){const q=last.vfc/b;comp.push({n:'VFC noturna',s:clamp(70+(q-1)*300),w:40,val:last.vfc+' ms',ref:'base '+f1(b,0)+' ms',d:(q>=1?'+':'−')+f1(Math.abs(q-1)*100,0)+'%'})}}

 if(fresh&&k.fcr&&rb.length&&k.data&&Math.abs(toMs(k.data)-last.ms)<=DAY){const b=mean(rb),dd=k.fcr-b;comp.push({n:'FC de repouso',s:clamp(80-dd*8),w:15,val:k.fcr+' bpm',ref:'média '+f1(b,0)+' bpm',d:(dd>=0?'+':'−')+f1(Math.abs(dd),0)})}

function planDay(w,ms){const ab=DAB[new Date(ms).getUTCDay()],dm=fmtDM(ms);return w.rows.find(r=>r[0]===ab)||w.rows.find(r=>String(r[0])===ab+' '+dm)||null}
const niceT=t=>t==='Fácil'?'Rodagem fácil':t;
const estMin=(km,p)=>{const m=String(p).match(/(\d+):(\d+)(?:–(\d+):(\d+))?/);if(!m||!km)return null;const a=+m[1]*60+ +m[2],b=m[3]?+m[3]*60+ +m[4]:a;return Math.round(km*(a+b)/2/60)};
const kindOf=t=>/PROVA/.test(t)?'race':/^Folga/.test(t)?'rest':/^Fácil/.test(t)?'easy':/^Longão/.test(t)?'long':/@I|@T|Qualidade/.test(t)?'q':'easy';
const KIND={race:['Prova','#ff8a6b','P'],rest:['Folga','#66748f','—'],easy:['Fácil','#17a593','F'],long:['Longão','#8f80ee','L'],q:['Qualidade','#e06a30','Q']};
function today(rd){const N=NOW(),P=planBuild({cur:true}),w=P.weeks[0],row=planDay(w,N),done=ACTS.filter(a=>a.ms===N),yest=ACTS.filter(a=>a.ms===N-DAY);

 const yF=OTH.filter(o=>o.ms===N-DAY&&o.k==='F'),yM=OTH.filter(o=>o.ms===N-DAY&&o.k==='M'),yHard=yest.some(a=>HARDC.includes(a.cat)||a.km>=16)||yF.length>0,sc=rd&&rd.fresh?rd.score:null,eR=`${fmtP(paceAt(P.Vc,.74))}–${fmtP(paceAt(P.Vc,.59))}`;
 if(kind==='q'&&((sc!=null&&sc<42)||yHard))adj={t:'Fácil, ritmo de conversa',km:Math.min(8,Math.max(5,Math.round(plan.km*.7))),p:eR,why:yF.length?'Ontem teve futebol, que conta como treino intenso. Qualidade logo depois rende menos e aumenta o risco de lesão.':yHard?'Ontem já foi um treino forte. Dois dias fortes seguidos aumentam o risco e rendem menos.':'A prontidão está baixa. Troque a qualidade por um treino fácil e passe o treino forte para amanhã, se os sinais melhorarem.'};

 return{N,P,w,plan,kind,adj,done,yest,note,oth}}

function weekStrip(T){const N=T.N,ws=weekStart(N);let pk=0,dk=0;
 const cells=[1,2,3,4,5,6,0].map((_,i)=>{const ms=ws+i*DAY,row=planDay(T.w,ms),kd=row?kindOf(row[1]):'rest',acts=ACTS.filter(a=>a.ms===ms),km=sum(acts.map(a=>a.km)),pkm=row?row[2]||0:0;pk+=pkm;dk+=km;
  const st=acts.length?'done':ms<N?(kd==='rest'?'rest':'miss'):ms===N?'today':'next',K=KIND[kd];
  const oo=OTH.filter(o=>o.ms===ms&&o.k!=='O'),tip=`<b>${DLONG[new Date(ms).getUTCDay()]} ${fmtDM(ms)}</b><br>Plano: ${row?esc(row[1])+(pkm?' · '+f1(pkm,0)+' km':''):'folga'}${acts.length?'<br>Feito: '+acts.map(a=>esc(a.title)+' · '+f1(a.km,1)+' km').join('<br>'):''}${oo.length?'<br>'+oo.map(o=>OK[o.k][0]+' · '+fmtH(o.sec)).join('<br>'):''}`;
  return`<div class="wd ${st}"${tipA(tip)}><span>${DAB[new Date(ms).getUTCDay()]}</span><i style="--k:${K[1]}">${st==='done'?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':K[2]}</i><b>${acts.length?f1(km,km<10?1:0):pkm?f1(pkm,0):'·'}</b>${oo.length?`<em class="wo">${[...new Set(oo.map(o=>o.k))].map(k=>`<u style="background:${OK[k][1]}">${oIcon(k,'#06101f',11)}</u>`).join('')}</em>`:''}</div>`});

 const byD=new Map(REC.r.map(r=>[r.d,r])),pairs=ACTS.filter(a=>a.ms>=N-180*DAY&&isEasy(a)).map(a=>({a,r:byD.get(a.d)})).filter(o=>o.r&&o.r.sl!=null),hi=pairs.filter(o=>o.r.sl>=80),lo=pairs.filter(o=>o.r.sl<70);
 if(hi.length>=4&&lo.length>=4){const d=(mean(hi.map(o=>EF(o.a)))/mean(lo.map(o=>EF(o.a)))-1)*100;out.push(`Depois de noites com sono acima de 80, seus treinos fáceis rendem <b>${f1(Math.abs(d),1)}% ${d>=0?'mais':'menos'}</b> por batimento do que depois de noites abaixo de 70.`)}
 const Y=new Date(N).getUTCFullYear(),ya=ACTS.filter(a=>new Date(a.ms).getUTCFullYear()===Y),h=sum(ya.map(a=>a.sec))/3600;if(ya.length>20)out.push(`Em ${Y} você já passou <b>${f1(h,0)} horas correndo</b>, o equivalente a ${f1(h/24,1)} dias inteiros, em ${ya.length} treinos.`);

 const fm=OTH.filter(o=>o.k==='F'),mm=OTH.filter(o=>o.k==='M'),c28=(L,a,b)=>L.filter(o=>o.ms>=N-a*DAY&&o.ms<=N-b*DAY).length;if(fm.length>=4)out.push(`Futebol: <b>${c28(fm,27,0)} jogo${c28(fm,27,0)===1?'':'s'}</b> nos últimos 28 dias, contra ${c28(fm,55,28)} nos 28 dias anteriores.`);if(mm.length>=4){const a=c28(mm,27,0);out.push(`Musculação: <b>${a} sessões</b> em 28 dias (${f1(a/4,1)} por semana). Para quem corre, 2 por semana é o ponto ideal.`)}

function fromHash(){const h=location.hash.slice(1);if(h==='card'||PAGES.some(p=>p[0]===h))S.page=h}
addEventListener('popstate',()=>{fromHash();render();scrollTo(0,0)});
$('#burger').onclick=()=>document.body.classList.toggle('open');
$('#scrim').onclick=()=>document.body.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('open')});

/* tooltip (mouse e toque) */
const tip=$('#tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
 tip.innerHTML=t.getAttribute('data-tip');tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=Math.max(8,e.clientX-r.width-14);if(y+r.height>innerHeight-8)y=Math.max(8,e.clientY-r.height-14);tip.style.left=x+'px';tip.style.top=y+'px'}
document.addEventListener('mousemove',showTip);
document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true,capture:true});

/* controles */
$('#hmax').onchange=e=>{S.hrmax=clamp(+e.target.value||190,150,220);e.target.value=S.hrmax;render()};
$('#hrest').onchange=e=>{S.hrrest=clamp(+e.target.value||45,30,80);e.target.value=S.hrrest;render()};

let _cw=CW(),_rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{if(CW()!==_cw){_cw=CW();render()}},200)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e});
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
goalInit();loadRaw(RAW);fromHash();render();
</script>
