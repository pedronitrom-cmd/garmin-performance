<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garmin Performance Center</title>
<style>
:root{color-scheme:dark;--bg:#121211;--s1:#1a1a19;--s2:#232321;--bd:#34342f;--tx:#f0efec;--tx2:#c3c2b7;--mu:#8f8e86;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--info:#6da7ec}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(18,18,17,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:10px 18px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
h1{font-size:15px;letter-spacing:.08em;margin:0;text-transform:uppercase}
h1 small{display:block;color:var(--mu);font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--tx2)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{background:var(--s1);color:var(--tx2);border:0;padding:6px 11px;cursor:pointer;font:inherit}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--c1);color:#fff}
input[type=number],input[type=search],select{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 7px;font:inherit}
input[type=number]{width:62px}
.btn{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--c1)}
nav{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:8px;font-size:12px}
nav a{color:var(--tx2);text-decoration:none;padding:2px 0;border-bottom:1px solid transparent}
nav a:hover{color:var(--tx);border-color:var(--c1)}
main{max-width:1240px;margin:0 auto;padding:18px}
section{margin:0 0 30px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:0 0 4px}
h3{font-size:19px;margin:0 0 12px;font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;min-width:0}
.card h4{margin:0 0 2px;font-size:13px;font-weight:600}
.card .sub{color:var(--mu);font-size:12px;margin:0 0 8px}
.kpi b{display:block;font-size:24px;font-weight:650;letter-spacing:-.01em}
.kpi span{color:var(--mu);font-size:12px}
.kpi i{display:block;font-style:normal;font-size:11px;color:var(--tx2);margin-top:2px}
.ev{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.ev .card{border-left:4px solid var(--info)}
.ev .ok{border-left-color:var(--good)}.ev .warn{border-left-color:var(--warn)}.ev .bad{border-left-color:var(--crit)}
.ev h4{display:flex;gap:8px;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2);font-weight:500}
.ok .badge{color:#4fd04f;border-color:#1c6b1c}.warn .badge{color:var(--warn);border-color:#7a5a0a}.bad .badge{color:#ee7a7a;border-color:#7a2323}
.ev p{margin:4px 0 0;color:var(--tx2)}
svg{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--mu);font-size:10.5px;font-family:inherit}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tx2);margin:6px 0 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hit{fill:transparent}.hit:hover{fill:rgba(255,255,255,.07)}
.pt{stroke:var(--s1);stroke-width:2}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;cursor:default;position:sticky;top:0;background:var(--s1)}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td.l,th.l{text-align:left}
td.t{white-space:normal;max-width:340px}
.sc{max-height:480px;overflow:auto;border:1px solid var(--bd);border-radius:10px}
tr:hover td{background:rgba(255,255,255,.03)}
.pill{display:inline-block;padding:0 7px;border-radius:99px;font-size:11px;border:1px solid var(--bd);color:var(--tx2)}
.note{font-size:12px;color:var(--mu);margin-top:8px}
#tip{position:fixed;pointer-events:none;z-index:50;background:#0c0c0b;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.4;display:none;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip b{color:#fff}
.bar1{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.bar1 div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#111;font-weight:600;min-width:2px}
footer{max-width:1240px;margin:0 auto;padding:0 18px 40px;color:var(--mu);font-size:12px}
ul.q{margin:6px 0 0;padding-left:18px;color:var(--tx2)}ul.q li{margin:2px 0}
@media(max-width:560px){.g2{grid-template-columns:1fr}.ev{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <h1>Garmin Performance Center<small id="sub"></small></h1>
  <div class="ctl">
   <span class="seg" id="rng"></span>
   <label>FC máx <input type="number" id="hmax" min="150" max="220" value="190"></label>
   <label>FC repouso <input type="number" id="hrest" min="30" max="80" value="45"></label>
   <label class="btn">Atualizar com HTML do site<input type="file" id="file" accept=".html,.htm" hidden></label>
  </div>
 </div>
 <nav>
  <a href="#avaliacao">Avaliação</a><a href="#volume">Volume</a><a href="#carga">Carga</a><a href="#intensidade">Intensidade</a>
  <a href="#eficiencia">Eficiência</a><a href="#provas">Provas</a><a href="#intervalados">Intervalados</a>
  <a href="#recuperacao">Recuperação</a><a href="#treinos">Treinos</a><a href="#dados">Qualidade dos dados</a>
 </nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div id="tip"></div>
<script>const RAW=/*DATA*/;</script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5, MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const toMs=d=>Date.parse(d+'T00:00:00Z');
const isoD=ms=>new Date(ms).toISOString().slice(0,10);
const fmtP=s=>{if(s==null||!isFinite(s))return'—';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const f1=(v,d=1)=>v==null||!isFinite(v)?'—':v.toFixed(d).replace('.',',');
const fmtD=ms=>{const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2)};
const fmtM=ms=>{const d=new Date(ms);return MES[d.getUTCMonth()]+'/'+String(d.getUTCFullYear()).slice(2)};
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>a.length?sum(a)/a.length:null;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pearson=(x,y)=>{const n=x.length;if(n<4)return null;const mx=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const weekStart=ms=>ms-((new Date(ms).getUTCDay()+6)%7)*DAY;
const C=['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9'];
const ZC=['#86b6ef','#3987e5','#c98500','#d95926','#e66767'];
const CATC={'Prova':'#e66767','Intervalado':'#d95926','Limiar/Ritmo':'#c98500','Progressivo':'#d55181','Longo':'#9085e9','Rodagem':'#3987e5','Leve':'#199e70','Esteira':'#8f8e86','Teste':'#e6a94c','Curto':'#6a6a63'};

/* ============ dados ============ */
let ACTS=[],REC={m:[],r:[],k:{}},SRC='Garmin Connect (sync automático)';
const S={range:'all',hrmax:190,hrrest:45,cat:'',q:'',sort:'ms',desc:true,all:false};

function classify(a){const t=norm(a.title);
 if(/simulador/.test(t))return'Limiar/Ritmo';
 if(a.km>40||/\bprova\b|corrida 10k|circuito caixa|fau run|meia maratona|10 milhas|desafio do parque|live run|zumbi|bahamas|santander|sunset|integracao|super maxi|trabalhador|corrida abc|10k - abc|abc uberlandia|supermercado/.test(t))return'Prova';
 if(/teste de ritmo/.test(t))return'Limiar/Ritmo';
 if(/teste/.test(t))return'Teste';
 if(/interval|tiro|\d\s*x\s*\d|fartlek|sub20/.test(t))return'Intervalado';
 if(/limiar|continuo|ritmo cont|treino-chave|taper|polimento|\bpre\b/.test(t))return'Limiar/Ritmo';
 if(/progress/.test(t))return'Progressivo';
 if(a.km>=14||/long/.test(t))return'Longo';
 if(/regenerativo|leve|soltura|recupera/.test(t))return'Leve';
 if(a.ty==='T'){const fast=a.laps.filter(l=>l.km>=.9&&l.sec<240).length;return fast>=3?'Intervalado':'Esteira'}
 if(a.km<3.6)return'Curto';
 return'Rodagem'}
function prep(rows){return rows.map(r=>{const f=r[8]||[],laps=[];for(let i=0;i+2<f.length;i+=3)laps.push({km:f[i],sec:f[i+1],hr:f[i+2]});
 const a={d:r[0],t:r[1],ty:r[2],title:r[3],km:r[4],sec:r[5],hr:r[6],hrmax:r[7],laps,ms:toMs(r[0])};a.pace=a.sec/a.km;a.cat=classify(a);return a}).sort((x,y)=>y.ms-x.ms||(y.t>x.t?1:-1))}
function loadRaw(raw){ACTS=prep(raw.a);REC={m:raw.m||[],r:raw.r||[],k:raw.k||{}};if(raw.src)SRC=raw.src}
const NOW=()=>Math.max(toMs(new Date().toISOString().slice(0,10)),ACTS.length?ACTS[0].ms:0);
const sinceMs=()=>({all:0,'12m':NOW()-364*DAY,'6m':NOW()-182*DAY,'90d':NOW()-89*DAY,'30d':NOW()-29*DAY})[S.range];

/* ============ fisiologia ============ */
const hrr=hr=>Math.max(0,Math.min(1,(hr-S.hrrest)/(S.hrmax-S.hrrest)));
const zoneOf=hr=>{const r=hrr(hr);return r<.6?0:r<.7?1:r<.8?2:r<.9?3:4};
const tr1=(sec,hr)=>{const r=hrr(hr);return sec/60*r*.64*Math.exp(1.92*r)};
function trimp(a){const L=a.laps.filter(l=>l.hr!=null);const cov=sum(L.map(l=>l.sec));
 if(L.length&&cov>=.8*a.sec)return sum(L.map(l=>tr1(l.sec,l.hr)));return tr1(a.sec,a.hr)}
function zoneSec(a){const z=[0,0,0,0,0];const L=a.laps.filter(l=>l.hr!=null);const cov=sum(L.map(l=>l.sec));
 if(L.length&&cov>=.8*a.sec){L.forEach(l=>z[zoneOf(l.hr)]+=l.sec)}else z[zoneOf(a.hr)]+=a.sec;return z}
const isEasy=a=>['Rodagem','Leve','Longo'].includes(a.cat)&&a.ty!=='T'&&a.km>=4.5&&a.hr>=110&&a.hr<=172;
const EF=a=>(a.km*1000/(a.sec/60))/a.hr;

/* ============ gráficos ============ */
function nice(lo,hi,n=5){if(hi===lo)hi=lo+1;const st0=(hi-lo)/n,mag=10**Math.floor(Math.log10(st0)),r=st0/mag,st=(r<1.5?1:r<3?2:r<7?5:10)*mag;
 const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return t}
function frame(w,h,m){return{w,h,m,iw:w-m.l-m.r,ih:h-m.t-m.b}}
function yGrid(F,sc,ticks,fmt){return ticks.map(v=>`<line x1="${F.m.l}" x2="${F.w-F.m.r}" y1="${sc(v)}" y2="${sc(v)}" stroke="#34342f" stroke-width="1"/><text x="${F.m.l-6}" y="${sc(v)+3.5}" text-anchor="end">${fmt(v)}</text>`).join('')}
function xTicksT(F,x,x0,x1,fmt=fmtM,k=6){let s='';for(let i=0;i<=k;i++){const v=x0+(x1-x0)*i/k;s+=`<text x="${x(v)}" y="${F.h-F.m.b+16}" text-anchor="${i==0?'start':i==k?'end':'middle'}">${fmt(v)}</text>`}return s}
const tipA=h=>` data-tip="${esc(h)}"`;
const legend=(items)=>items.length>1?`<div class="lg">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`:'';

function lineChart({xs,series,w=760,h=220,yfmt=v=>v,ymin,ymax,xfmt=fmtM,tip,refs=[],ticksN=5,stepped=false}){
 const F=frame(w,h,{l:44,r:12,t:10,b:24});const vals=series.flatMap(s=>s.vals.filter(v=>v!=null)).concat(refs.map(r=>r.v));
 if(!vals.length)return'<p class="note">Sem dados no período.</p>';
 let lo=ymin??Math.min(...vals),hi=ymax??Math.max(...vals);const tk=nice(lo,hi,ticksN);lo=ymin??tk[0];hi=ymax??tk[tk.length-1];
 const x0=xs[0],x1=xs[xs.length-1]||x0+1;const x=v=>F.m.l+(x1===x0?F.iw/2:(v-x0)/(x1-x0)*F.iw),y=v=>F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
 let s=yGrid(F,y,tk.filter(v=>v>=lo-1e-9&&v<=hi+1e-9),yfmt)+xTicksT(F,x,x0,x1,xfmt);
 refs.forEach(r=>s+=`<line x1="${F.m.l}" x2="${w-F.m.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c||'#8f8e86'}" stroke-dasharray="4 4"/><text x="${w-F.m.r}" y="${y(r.v)-4}" text-anchor="end">${esc(r.t)}</text>`);
 series.forEach((se,si)=>{let d='',pen=false;se.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(xs[i]).toFixed(1)+' '+y(v).toFixed(1);pen=true});
  s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${se.dash?' stroke-dasharray="5 4"':''}/>`;
  if(xs.length<=40)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(xs[i]).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${se.c}" class="pt"/>`})});
 const n=xs.length;xs.forEach((xv,i)=>{const a=i?(x(xs[i-1])+x(xv))/2:F.m.l,b=i<n-1?(x(xv)+x(xs[i+1]))/2:w-F.m.r;
  s+=`<rect class="hit" x="${a.toFixed(1)}" y="${F.m.t}" width="${Math.max(1,b-a).toFixed(1)}" height="${F.ih}"${tipA(tip(i))}/>`});
 return`<svg viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`}

function barChart({cats,vals,w=760,h=220,color=C[0],tip,yfmt=v=>v,labels,line,lineC=C[1],lineName}){
 const F=frame(w,h,{l:44,r:12,t:10,b:24});const hi0=Math.max(...vals,...(line||[]).filter(v=>v!=null),1);const tk=nice(0,hi0,5),hi=tk[tk.length-1];
 const y=v=>F.m.t+F.ih-v/hi*F.ih;const bw=F.iw/cats.length;let s=yGrid(F,y,tk,yfmt);
 const step=Math.ceil(cats.length/8);cats.forEach((c,i)=>{if(i%step===0)s+=`<text x="${F.m.l+bw*(i+.5)}" y="${h-F.m.b+16}" text-anchor="middle">${labels?labels[i]:c}</text>`});
 vals.forEach((v,i)=>{const bx=F.m.l+bw*i+Math.min(2,bw*.15),ww=Math.max(1,bw-2*Math.min(2,bw*.15)),hh=Math.max(0,F.m.t+F.ih-y(v));
  if(v>0)s+=`<path d="M${bx} ${F.m.t+F.ih}V${y(v)+Math.min(3,hh)}Q${bx} ${y(v)} ${bx+Math.min(3,ww/2)} ${y(v)}H${bx+ww-Math.min(3,ww/2)}Q${bx+ww} ${y(v)} ${bx+ww} ${y(v)+Math.min(3,hh)}V${F.m.t+F.ih}Z" fill="${color}"/>`;
  s+=`<rect class="hit" x="${F.m.l+bw*i}" y="${F.m.t}" width="${bw}" height="${F.ih}"${tipA(tip(i))}/>`});
 if(line){let d='',pen=false;line.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+(F.m.l+bw*(i+.5)).toFixed(1)+' '+y(v).toFixed(1);pen=true});s+=`<path d="${d}" fill="none" stroke="${lineC}" stroke-width="2" stroke-linejoin="round" pointer-events="none"/>`}
 return`<svg viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`}

function stackChart({cats,stacks,colors,w=760,h=220,tip,yfmt=v=>v,labels}){
 const F=frame(w,h,{l:44,r:12,t:10,b:24});const tot=stacks.map(sum);const tk=nice(0,Math.max(...tot,1),5),hi=tk[tk.length-1];
 const y=v=>F.m.t+F.ih-v/hi*F.ih;const bw=F.iw/cats.length;let s=yGrid(F,y,tk,yfmt);const step=Math.ceil(cats.length/8);
 cats.forEach((c,i)=>{if(i%step===0)s+=`<text x="${F.m.l+bw*(i+.5)}" y="${h-F.m.b+16}" text-anchor="middle">${labels[i]}</text>`;
  let acc=0;const bx=F.m.l+bw*i+2,ww=Math.max(1,bw-4);stacks[i].forEach((v,k)=>{if(v<=0)return;const y1=y(acc+v),y0=y(acc);s+=`<rect x="${bx}" y="${y1}" width="${ww}" height="${Math.max(0,y0-y1)}" fill="${colors[k]}" stroke="#1a1a19" stroke-width="1.5"/>`;acc+=v});
  s+=`<rect class="hit" x="${F.m.l+bw*i}" y="${F.m.t}" width="${bw}" height="${F.ih}"${tipA(tip(i))}/>`});
 return`<svg viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`}

function scatter({pts,w=760,h=240,yfmt,xmin,xmax,ymin,ymax,flip=false}){
 const F=frame(w,h,{l:48,r:12,t:10,b:24});const xv=pts.map(p=>p.x),yv=pts.map(p=>p.y);if(!pts.length)return'<p class="note">Sem dados no período.</p>';
 const x0=xmin??Math.min(...xv),x1=xmax??Math.max(...xv);let tk=nice(ymin??Math.min(...yv),ymax??Math.max(...yv),5);const lo=tk[0],hi=tk[tk.length-1];
 const x=v=>F.m.l+(x1===x0?F.iw/2:(v-x0)/(x1-x0)*F.iw),y=v=>flip?F.m.t+(v-lo)/(hi-lo)*F.ih:F.m.t+F.ih-(v-lo)/(hi-lo)*F.ih;
 let s=tk.map(v=>`<line x1="${F.m.l}" x2="${w-F.m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#34342f"/><text x="${F.m.l-6}" y="${y(v)+3.5}" text-anchor="end">${yfmt(v)}</text>`).join('')+xTicksT(F,x,x0,x1);
 pts.forEach(p=>{s+=`<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4.5" fill="${p.c}" class="pt"/><circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="11" fill="transparent"${tipA(p.tip)}/>`});
 return`<svg viewBox="0 0 ${w} ${h}" role="img">${s}</svg>`}

const card=(t,sub,body,extra='')=>`<div class="card"><h4>${t}</h4>${sub?`<p class="sub">${sub}</p>`:''}${body}${extra}</div>`;

/* ============ cálculos ============ */
function inR(a){return a.ms>=sinceMs()}
function weeklyAll(){const wk=new Map();for(const a of ACTS){const w=weekStart(a.ms);const o=wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]};
  o.km+=a.km;o.sec+=a.sec;o.n++;o.days.add(a.d);o.load+=trimp(a);zoneSec(a).forEach((v,i)=>o.z[i]+=v);wk.set(w,o)}
 const first=Math.min(...wk.keys()),last=weekStart(NOW()),out=[];for(let w=first;w<=last;w+=7*DAY)out.push(wk.get(w)||{w,km:0,sec:0,n:0,days:new Set(),load:0,z:[0,0,0,0,0]});return out}
function loadSeries(){const m=new Map();for(const a of ACTS)m.set(a.ms,(m.get(a.ms)||0)+trimp(a));
 const start=Math.min(...ACTS.map(a=>a.ms)),end=NOW();const o={xs:[],ctl:[],atl:[],tsb:[],ld:[]};let c=0,t=0;
 for(let d=start;d<=end;d+=DAY){const l=m.get(d)||0,tsb=c-t;c+=(l-c)/42;t+=(l-t)/7;o.xs.push(d);o.ctl.push(c);o.atl.push(t);o.tsb.push(tsb);o.ld.push(l)}return o}
const win=(from,to)=>ACTS.filter(a=>a.ms>=from&&a.ms<=to);
function monthlyAgg(list){const m=new Map();for(const a of list){const k=a.d.slice(0,7);const o=m.get(k)||{k,km:0,n:0,sec:0};o.km+=a.km;o.n++;o.sec+=a.sec;m.set(k,o)}return[...m.values()].sort((a,b)=>a.k<b.k?-1:1)}
const keyOf=t=>{t=norm(t);return['desafio do parque','fau run','live run','abc','nilson lima','10 milhas','circuito','zumbi'].find(k=>t.includes(k))||null};

/* ============ avaliação ============ */
function assess(){const N=NOW(),ev=[];const add=(sev,tag,title,text)=>ev.push({sev,tag,title,text});
 const w28=win(N-27*DAY,N),p28=win(N-55*DAY,N-28*DAY),b84=win(N-139*DAY,N-56*DAY);
 const v=sum(w28.map(a=>a.km)),vp=sum(p28.map(a=>a.km)),vb=sum(b84.map(a=>a.km))/3;
 const pct=vp?(v-vp)/vp*100:null;
 add(pct!=null&&Math.abs(pct)>35?'warn':'ok',pct==null?'—':(pct>=0?'+':'')+f1(pct,0)+'%','Volume (28 dias)',
  `${f1(v)} km em ${w28.length} treinos, contra ${f1(vp)} km nos 28 dias anteriores e média de ${f1(vb)} km por bloco de 28 dias nas 12 semanas antes disso. ${pct!=null&&pct>35?'Salto grande de volume: vale segurar a progressão.':pct!=null&&pct<-35?'Volume bem abaixo do recente (polimento ou queda de ritmo de treino).':'Variação dentro de uma faixa normal.'}`);
 const L=loadSeries(),i=L.xs.length-1,ctl=L.ctl[i],atl=L.atl[i],tsb=L.tsb[i];
 const a7=sum(L.ld.slice(-7)),c28=sum(L.ld.slice(-28))/4,acwr=c28?a7/c28:null;
 const sevL=acwr==null?'info':acwr>1.5?'bad':acwr>1.3?'warn':acwr<.8?'warn':'ok';
 add(sevL,acwr==null?'—':'ACWR '+f1(acwr,2),'Carga de treino',`Forma (CTL, 42d) ${f1(ctl,0)} · fadiga (ATL, 7d) ${f1(atl,0)} · equilíbrio (TSB) ${f1(tsb,0)}. Carga aguda/crônica ${f1(acwr,2)} (faixa 0,8–1,3 costuma ser a mais segura). ${acwr!=null&&acwr<.8?'Carga recente baixa (esperado após prova ou semana leve). ':''}${tsb>5?'Você está descansado: bom momento para uma sessão-chave ou prova.':tsb<-20?'Fadiga acumulada alta: priorize sono e treinos leves.':'Equilíbrio neutro entre forma e fadiga.'}`);
 const W=weeklyAll(),cw=W.slice(-9,-1);const dpw=mean(cw.map(w=>w.days.size)),zero=cw.filter(w=>w.n===0).length;
 add(dpw>=4?'ok':dpw>=3?'info':'warn',f1(dpw)+' dias/sem','Consistência (8 semanas completas)',`Média de ${f1(dpw)} dias corridos por semana e ${zero} semana(s) sem treino. Semanas: ${cw.map(w=>f1(w.km,0)).join(' · ')} km.`);
 const lg1=win(N-27*DAY,N).filter(a=>a.cat!=='Prova'||a.km>=10),lgA=Math.max(0,...lg1.map(a=>a.km)),lgB=Math.max(0,...win(N-83*DAY,N-28*DAY).map(a=>a.km));
 add('info',f1(lgA)+' km','Longão',`Maior corrida dos últimos 28 dias: ${f1(lgA)} km; nas 8 semanas anteriores: ${f1(lgB)} km. Maior corrida do histórico: ${f1(Math.max(...ACTS.map(a=>a.km)))} km.`);
 const zs=[0,0,0,0,0];w28.forEach(a=>zoneSec(a).forEach((s,k)=>zs[k]+=s));const zt=sum(zs)||1,easy=(zs[0]+zs[1])/zt*100,hard=(zs[3]+zs[4])/zt*100,mid=zs[2]/zt*100;
 add(hard>30?'warn':easy>=65?'ok':'info',f1(easy,0)+'% fácil','Distribuição de intensidade (28 dias)',`Z1+Z2 ${f1(easy,0)}% · Z3 ${f1(mid,0)}% · Z4+Z5 ${f1(hard,0)}% do tempo (zonas por FC de reserva, FCmáx ${S.hrmax}/repouso ${S.hrrest}). Referência 80/20: ~75–80% fácil. ${hard>30?'Muito tempo em intensidade alta: risco de acumular fadiga.':mid>35?'Muito tempo na zona cinza (Z3): fácil fica rápido demais e o forte não sai forte.':'Distribuição saudável.'}`);
 const e1=win(N-55*DAY,N).filter(isEasy),e0=win(N-111*DAY,N-56*DAY).filter(isEasy);
 if(e1.length>=4&&e0.length>=4){const a=median(e1.map(EF)),b=median(e0.map(EF)),d=(a/b-1)*100;
  add(d>=1.5?'ok':d<=-1.5?'warn':'info',(d>=0?'+':'')+f1(d)+'%','Eficiência aeróbica',`Em rodagens fáceis, a eficiência (ritmo ÷ FC) variou ${d>=0?'+':''}${f1(d)}% nas últimas 8 semanas vs as 8 anteriores. Ritmo mediano ${fmtP(median(e1.map(x=>x.pace)))}/km a ${f1(median(e1.map(x=>x.hr)),0)} bpm, antes ${fmtP(median(e0.map(x=>x.pace)))}/km a ${f1(median(e0.map(x=>x.hr)),0)} bpm. ${d>=1.5?'Sinal de adaptação positiva.':d<=-1.5?'Piora: calor, sono ruim ou fadiga podem explicar.':'Estável.'}`)}
 const races=ACTS.filter(a=>a.cat==='Prova');const lr=races[0];
 if(lr){const k=keyOf(lr.title);const prev=k?races.find(r=>r!==lr&&keyOf(r.title)===k&&Math.abs(r.km-lr.km)<.4&&r.ms<lr.ms&&lr.ms-r.ms<420*DAY):null;
  add('info',fmtT(lr.sec),'Última prova',`${esc(lr.title)} (${fmtD(lr.ms)}): ${f1(lr.km,2)} km em ${fmtT(lr.sec)} (${fmtP(lr.pace)}/km), FC ${lr.hr}/${lr.hrmax}.`+(prev?` Mesma prova em ${fmtD(prev.ms)}: ${fmtT(prev.sec)} (${prev.sec>lr.sec?'-':'+'}${Math.abs(Math.round(lr.sec-prev.sec))}s hoje), FC ${prev.hr}/${prev.hrmax}.`:''))}
 const mm=REC.m;if(mm.length>14){const g=(a,b,j)=>mean(mm.slice(a,b).map(r=>r[j]).filter(v=>v!=null));
  const sh=g(1,4,1),sh0=g(13,16,1),ss=g(1,4,2),ss0=g(13,16,2);const k=REC.k||{};
  const hv=mean(mm.slice(1,13).map(r=>r[3])),rh=median(mm.slice(1,13).map(r=>r[6]));
  const okHrv=k.vfc==null||k.vfc7==null||k.vfc>=k.vfc7*.92,okRhr=k.fcr==null||k.fcr<=rh+3;
  add(okHrv&&okRhr&&(sh>=6.5)?'ok':'warn',k.vfc!=null?`VFC ${k.vfc} ms`:'—','Recuperação',`${k.vfc!=null?`VFC noturna ${k.vfc} ms (média 7d ${k.vfc7}; média mensal 12m ${f1(hv,0)}). FC de repouso ${k.fcr} bpm (mediana 12m ${f1(rh,0)}). `:''}Sono médio dos últimos 3 meses: ${f1(sh)} h / score ${f1(ss,0)}, contra ${f1(sh0)} h / ${f1(ss0,0)} no mesmo período de um ano atrás${sh0-sh>.4?' — queda relevante de sono, o ponto mais fraco da recuperação':''}.`)}
 return ev}

 return`<div class="grid kpis">${k('Distância',f1(km,0)+' km',list.length+' treinos')}${k('Tempo',f1(sec/3600,0)+' h',days+' dias corridos')}${k('Ritmo médio',fmtP(sec/(km||1))+'/km','ponderado por distância')}${k('FC média',f1(hrw,0)+' bpm','ponderada por tempo')}${k('Maior corrida',f1(Math.max(0,...list.map(a=>a.km)))+' km','')}${k('Carga (TRIMP)',f1(sum(list.map(trimp)),0),'Banister, FC reserva')}</div>`}

  const d=pv?r.sec-pv.sec:null;return`<tr><td class="l">${fmtD(r.ms)}</td><td class="l t">${esc(r.title)}</td><td>${f1(r.km,2)}</td><td>${fmtT(r.sec)}</td><td>${fmtP(r.pace)}</td><td>${r.hr}/${r.hrmax}</td><td>${d==null?'—':(d<0?'▼ ':'▲ ')+Math.abs(Math.round(d))+'s'}</td></tr>`}).join('');
 const rc=R.filter(r=>r.km>=4.9&&r.km<40).sort((a,b)=>a.ms-b.ms);
 const sc=scatter({pts:rc.map(r=>({x:r.ms,y:r.pace,c:r.km>=15?C[5]:r.km>=9?C[0]:C[1],tip:`<b>${esc(r.title)}</b><br>${fmtD(r.ms)} · ${f1(r.km,2)} km<br>${fmtT(r.sec)} · ${fmtP(r.pace)}/km · FC ${r.hr}`})),yfmt:fmtP,flip:true,xmin:rc.length?rc[0].ms:0,xmax:N});
 return`<section id="provas"><h2>Provas</h2><h3>Resultados, recordes e projeções</h3><div class="grid g2">
 ${card('Ritmo das provas ao longo do tempo','Cada ponto é uma prova (≥4,9 km). Mais alto = mais rápido.',sc,legend([['5–8 km',C[1]],['10 km',C[0]],['≥15 km',C[5]]]))}
 ${card('Projeção (Riegel) a partir do melhor resultado dos últimos 12 meses',cand?`Base: ${esc(cand.r.title)} (${fmtD(cand.r.ms)}, ${f1(cand.r.km,2)} km em ${fmtT(cand.r.sec)}).`:'',`<table><thead><tr><th class="l">Distância</th><th>Tempo</th><th>Ritmo</th></tr></thead><tbody>${pred}</tbody></table>`,`<p class="note">Estimativa de equivalência, não promessa: Riegel (expoente 1,06) tende a ser otimista na maratona, que depende de longões e nutrição.</p>`)}
 ${card('Melhores marcas por distância (provas)','',`<table><thead><tr><th class="l">Distância</th><th>Provas</th><th>Melhor</th><th>Últimos 12m</th></tr></thead><tbody>${prRows}</tbody></table>`)}
 </div><div class="card" style="margin-top:12px"><h4>Todas as provas</h4><p class="sub">▼ / ▲ = tempo menor/maior que a mesma prova (mesma distância) no ano anterior, quando existe.</p><div class="sc"><table><thead><tr><th class="l">Data</th><th class="l">Prova</th><th>km</th><th>Tempo</th><th>Ritmo</th><th>FC méd/máx</th><th>vs ano ant.</th></tr></thead><tbody>${rows}</tbody></table></div></div></section>`}

function repSessions(){const out=[];for(const a of ACTS){if(!['Intervalado','Limiar/Ritmo'].includes(a.cat)||!a.laps.length)continue;
  const reps=a.laps.filter(l=>l.km>=.35&&l.sec/l.km<=265);if(reps.length<3)continue;const pc=reps.map(l=>l.sec/l.km),hr=reps.map(l=>l.hr).filter(v=>v!=null);
  const med=median(reps.map(l=>l.km)),grp=med<.5?'400 m':med<.7?'600 m':med<.9?'800 m':'1 km';
  out.push({a,n:reps.length,grp,avg:mean(pc),best:Math.min(...pc),fade:(pc[pc.length-1]/pc[0]-1)*100,hr:mean(hr),hrmax:Math.max(...hr,0)})}
 return out}
function secInterv(){const all=repSessions().filter(s=>inR(s.a)).sort((a,b)=>a.a.ms-b.a.ms);
 if(!all.length)return`<section id="intervalados"><h2>Intervalados</h2><h3>Qualidade das repetições</h3><p class="note">Sem sessões com voltas detalhadas no período. As voltas só existem para parte dos treinos (veja Qualidade dos dados).</p></section>`;
 const gc={'400 m':C[4],'600 m':C[3],'800 m':C[2],'1 km':C[0]};
 const sc=scatter({pts:all.map(s=>({x:s.a.ms,y:s.avg,c:gc[s.grp],tip:`<b>${esc(s.a.title)}</b><br>${fmtD(s.a.ms)}<br>${s.n} reps de ${s.grp}: ${fmtP(s.avg)}/km (melhor ${fmtP(s.best)})<br>Queda 1ª→última: ${(s.fade>=0?'+':'')+f1(s.fade)}%<br>FC média reps ${f1(s.hr,0)} (máx ${s.hrmax})`})),yfmt:fmtP,flip:true,xmin:all[0].a.ms,xmax:Math.max(all[all.length-1].a.ms,NOW())});
 const k1=all.filter(s=>s.grp==='1 km'),N=NOW(),r1=k1.filter(s=>s.a.ms>=N-59*DAY),r0=k1.filter(s=>s.a.ms<N-59*DAY&&s.a.ms>=N-119*DAY);
 const tr=r1.length>=2&&r0.length>=2?`Ritmo médio das repetições de 1 km: ${fmtP(mean(r1.map(s=>s.avg)))}/km nos últimos 60 dias vs ${fmtP(mean(r0.map(s=>s.avg)))}/km nos 60 anteriores.`:'';
 const rows=[...all].reverse().map(s=>`<tr><td class="l">${fmtD(s.a.ms)}</td><td class="l t">${esc(s.a.title)}</td><td>${s.n}×${s.grp}</td><td>${fmtP(s.avg)}</td><td>${fmtP(s.best)}</td><td>${(s.fade>=0?'+':'')+f1(s.fade)}%</td><td>${f1(s.hr,0)}</td><td>${s.hrmax}</td></tr>`).join('');
 return`<section id="intervalados"><h2>Intervalados</h2><h3>Qualidade das repetições</h3>
 <p class="note" style="margin:-6px 0 10px">Repetição = volta de ≥350 m a ≤4:25/km, em treinos classificados como intervalado ou limiar. ${tr}</p>
 <div class="grid g2">${card('Ritmo médio das repetições por sessão','Mais alto = mais rápido',sc,legend(Object.entries(gc)))}
 ${card('Sessões','Queda = ritmo da última repetição vs primeira (positivo = desacelerou)',`<div class="sc" style="max-height:330px"><table><thead><tr><th class="l">Data</th><th class="l">Treino</th><th>Reps</th><th>Média</th><th>Melhor</th><th>Queda</th><th>FC</th><th>FCmáx</th></tr></thead><tbody>${rows}</tbody></table></div>`)}</div></section>`}

function secRec(){const M=[...REC.m].reverse();if(!M.length)return'';const xs=M.map(r=>toMs(r[0]+'-15'));const k=REC.k||{};
 const mk=(j,c,fmt,name)=>lineChart({xs,series:[{c,vals:M.map(r=>r[j])}],w:420,h:180,yfmt:fmt,tip:i=>`<b>${fmtM(xs[i])}</b><br>${name}: ${fmt(M[i][j])}`,ticksN:4});
 const kp=(l,v,i)=>`<div class="card kpi"><span>${l}</span><b>${v}</b>${i?`<i>${i}</i>`:''}</div>`;
 const kk=k.data?`<div class="grid kpis" style="margin-bottom:12px">${kp('Sono',k.sono,'score '+k.score)}${kp('VFC noturna',k.vfc+' ms','média 7d '+k.vfc7+' ms')}${kp('FC repouso',k.fcr+' bpm','')}${kp('Body Battery',k.bb,'valor do site')}${kp('Estresse',k.estresse,'média diária')}${kp('Passos',k.passos,'dia parcial?')}${kp('SpO₂',k.spo2+'%','')}${kp('Respiração',f1(k.resp)+' rpm','')}</div><p class="note" style="margin:-4px 0 12px">Registro mais recente do site (${k.data}). Estresse 7 e 664 passos indicam dia ainda em andamento — não compare com médias de dia fechado.</p>`:'';
 const runs=d=>ACTS.filter(a=>a.d===d);
 const jr=[...REC.r].sort((a,b)=>a[0]<b[0]?1:-1).map(r=>{const rs=runs(r[0]);return{d:r[0],sl:r[1],vfc:r[2],bb:r[3],km:sum(rs.map(a=>a.km)),pace:sum(rs.map(a=>a.sec))/(sum(rs.map(a=>a.km))||1),hr:rs.length?sum(rs.map(a=>a.hr*a.sec))/sum(rs.map(a=>a.sec)):null,cats:[...new Set(rs.map(a=>a.cat))].join(', '),ef:(()=>{const e=rs.filter(isEasy);return e.length?mean(e.map(EF)):null})()}});
 const pe=(f,g)=>{const p=jr.filter(r=>r[f]!=null&&r[g]!=null);return{r:pearson(p.map(r=>r[f]),p.map(r=>r[g])),n:p.length}};
 const c1=pe('vfc','ef'),c2=pe('sl','ef'),c3=pe('vfc','hr');
 const cs=(x)=>x.r==null?'amostra pequena':`r = ${f1(x.r,2)} (n = ${x.n})`;
 const jrT=jr.filter(r=>r.km>0).slice(0,40);const rows=jrT.map(r=>`<tr><td class="l">${fmtD(toMs(r.d))}</td><td class="l">${r.cats}</td><td>${f1(r.km)}</td><td>${fmtP(r.pace)}</td><td>${f1(r.hr,0)}</td><td>${r.sl??'—'}</td><td>${r.vfc??'—'}</td><td>${r.bb??'—'}</td></tr>`).join('');
 return`<section id="recuperacao"><h2>Recuperação</h2><h3>Sono, VFC e prontidão</h3>${kk}
 <div class="grid g3">${card('Sono (horas)','Média mensal',mk(1,C[5],v=>f1(v)+' h','Sono'))}${card('Pontuação do sono','',mk(2,C[0],v=>f1(v,0),'Score'))}${card('VFC noturna (ms)','',mk(3,C[2],v=>f1(v,0)+' ms','VFC'))}
 ${card('FC de repouso (bpm)','',mk(6,C[1],v=>f1(v,0)+' bpm','FC repouso'))}${card('Body Battery','Média mensal (definição do site)',mk(4,C[3],v=>f1(v,0),'Body Battery'))}${card('Estresse médio','',mk(5,C[4],v=>f1(v,0),'Estresse'))}</div>
 <div class="grid g2" style="margin-top:12px">${card(`Treinos × recuperação (últimos ${jrT.length} dias com treino)`,'Sono, VFC e Body Battery da mesma data do treino',`<div class="sc" style="max-height:360px"><table><thead><tr><th class="l">Data</th><th class="l">Tipo</th><th>km</th><th>Ritmo</th><th>FC</th><th>Sono</th><th>VFC</th><th>BB</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
 ${card('Associações exploratórias','Pearson entre recuperação do dia e desempenho',`<ul class="q"><li>VFC × eficiência (rodagens fáceis): ${cs(c1)}</li><li>Score do sono × eficiência: ${cs(c2)}</li><li>VFC × FC média do dia: ${cs(c3)}</li></ul><p class="note">Poucos pontos e sem controle de clima, tipo de treino ou horário: use como pista, não como conclusão. ${REC.r.length>=200?'Base: '+REC.r.length+' dias de resumo diário.':'Base pequena: o HTML do site traz só os últimos dias.'}</p>`)}</div></section>`}

function secTreinos(){return`<section id="treinos"><h2>Treinos</h2><h3>Todas as atividades</h3><div class="ctl" style="margin-bottom:8px"><select id="fcat"><option value="">Todos os tipos</option>${Object.keys(CATC).map(c=>`<option>${c}</option>`).join('')}</select><input type="search" id="fq" placeholder="Buscar título…" style="min-width:200px"><span id="fcount"></span></div><div id="ttab"></div></section>`}
function renderTable(){const cols=[['ms','Data','l'],['cat','Tipo','l'],['title','Título','l'],['km','km'],['sec','Tempo'],['pace','Ritmo'],['hr','FC'],['hrmax','FCmáx'],['tr','TRIMP']];
 let L=ACTS.filter(inR).filter(a=>!S.cat||a.cat===S.cat).filter(a=>!S.q||norm(a.title).includes(norm(S.q)));
 const v=a=>S.sort==='tr'?trimp(a):a[S.sort];L=[...L].sort((a,b)=>{const x=v(a),y=v(b);const c=typeof x==='string'?x.localeCompare(y):x-y;return S.desc?-c:c});
 $('#fcount').textContent=L.length+' atividades';const sh=S.all?L:L.slice(0,80);
 $('#ttab').innerHTML=`<div class="sc"><table><thead><tr>${cols.map(c=>`<th class="s ${c[2]||''}" data-s="${c[0]}">${c[1]}${S.sort===c[0]?(S.desc?' ▼':' ▲'):''}</th>`).join('')}</tr></thead><tbody>${sh.map(a=>`<tr><td class="l">${fmtD(a.ms)} <small style="color:var(--mu)">${a.t}</small></td><td class="l"><span class="pill" style="border-color:${CATC[a.cat]};color:${CATC[a.cat]}">${a.cat}${a.ty==='T'&&a.cat!=='Esteira'?' · esteira':''}</span></td><td class="l t">${esc(a.title)}</td><td>${f1(a.km,2)}</td><td>${fmtT(a.sec)}</td><td>${fmtP(a.pace)}</td><td>${a.hr}</td><td>${a.hrmax}</td><td>${f1(trimp(a),0)}</td></tr>`).join('')}</tbody></table></div>${!S.all&&L.length>80?`<p class="note"><a href="#" id="more" style="color:var(--c1)">Mostrar todas (${L.length})</a></p>`:''}`;
 document.querySelectorAll('#ttab th.s').forEach(th=>th.onclick=()=>{const k=th.dataset.s;if(S.sort===k)S.desc=!S.desc;else{S.sort=k;S.desc=true}renderTable()});
 const mo=$('#more');if(mo)mo.onclick=e=>{e.preventDefault();S.all=true;renderTable()}}

function secDados(){const asc=[...ACTS].sort((a,b)=>a.ms-b.ms);const gaps=[];for(let i=1;i<asc.length;i++){const g=(asc[i].ms-asc[i-1].ms)/DAY;if(g>21)gaps.push(`${fmtD(asc[i-1].ms)} → ${fmtD(asc[i].ms)} (${Math.round(g)} dias)`)}
 const byDay={};ACTS.forEach(a=>byDay[a.d]=(byDay[a.d]||0)+1);const multi=Object.values(byDay).filter(n=>n>1).length;
 const slow=ACTS.filter(a=>a.pace>510&&a.ty!=='T'),withLaps=ACTS.filter(a=>a.laps.length).length;
 return`<section id="dados"><h2>Qualidade dos dados</h2><h3>O que olhar com cuidado</h3><div class="card"><ul class="q">
 <li><b>Lacunas no histórico</b> (&gt;21 dias sem registro): ${gaps.length?gaps.join('; '):'nenhuma'}. Isso afeta CTL/ATL no começo da série.</li>
 <li><b>${multi} dias com 2+ atividades</b> (aquecimento gravado à parte antes de prova/treino). Os totais diários somam tudo; a lista de treinos mostra cada atividade.</li>
 <li><b>${slow.length} ${slow.length===1?'atividade':'atividades'} com ritmo médio acima de 8:30/km</b> (provável caminhada, pausa gravada ou GPS ruim)${slow.length?': '+slow.slice(0,4).map(a=>fmtD(a.ms)+' '+f1(a.km)+' km').join(', '):''}.</li>
 <li><b>Voltas detalhadas</b> disponíveis em ${withLaps} de ${ACTS.length} atividades — o restante usa só médias do treino (zonas e intervalados ficam mais grosseiros no passado).</li>
 <li><b>Títulos com data divergente</b> (ex.: “INTERVALADO 3x2KM 01/09” em 01/10): a classificação usa o conteúdo do título, não a data escrita nele.</li>
 
 <li><b>Fonte</b>: ${esc(SRC)}. Body Battery = último valor do dia (latestValue do Garmin), então dias em andamento aparecem altos.</li></ul></div></section>`}

function secAval(){const ev=assess();const ic={ok:'✓',warn:'▲',bad:'✕',info:'●'};
 return`<section id="avaliacao"><h2>Avaliação</h2><h3>Onde você está hoje</h3><div class="ev">${ev.map(e=>`<div class="card ${e.sev}"><h4><span>${ic[e.sev]}</span>${e.title}<span class="badge">${e.tag}</span></h4><p>${e.text}</p></div>`).join('')}</div></section>`}

/* ============ render ============ */
function render(){
 if(!ACTS.length){$('#app').innerHTML='<p>Sem dados.</p>';return}
 const N=NOW(),first=ACTS[ACTS.length-1];
 $('#sub').textContent=`${ACTS.length} atividades · ${fmtD(first.ms)} a ${fmtD(ACTS[0].ms)} · ${f1(sum(ACTS.map(a=>a.km)),0)} km`;
 $('#rng').innerHTML=[['all','Tudo'],['12m','12 meses'],['6m','6 meses'],['90d','90 dias'],['30d','30 dias']].map(([k,t])=>`<button data-r="${k}" class="${S.range===k?'on':''}">${t}</button>`).join('');
 $('#rng').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;render()});
 const y=window.scrollY;
 $('#app').innerHTML=secAval()+secVolume()+secCarga()+secIntens()+secEficiencia()+secProvas()+secInterv()+secRec()+secTreinos()+secDados();
 $('#foot').textContent='Zonas e carga dependem de FC máx/repouso (topo). Dados: '+SRC+'.';
 $('#fcat').value=S.cat;$('#fq').value=S.q;$('#fcat').onchange=e=>{S.cat=e.target.value;renderTable()};$('#fq').oninput=e=>{S.q=e.target.value;renderTable()};
 renderTable();window.scrollTo(0,y)}

/* tooltip */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}
 tip.innerHTML=t.getAttribute('data-tip');tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true});

/* controles */
$('#hmax').onchange=e=>{S.hrmax=+e.target.value||190;render()};
$('#hrest').onchange=e=>{S.hrrest=+e.target.value||45;render()};

/* importar HTML do site */
const num=s=>{const m=String(s).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
const mmss=s=>{const p=String(s).trim().split(':').map(Number);if(p.some(isNaN))return null;return p.length==3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]};
function parseSite(doc){
 const acts=[...doc.querySelectorAll('article.activity')].map(a=>{const d=a.querySelector('.date').textContent.trim(),m=d.match(/(\d\d)\/(\d\d)\/(\d{4}) (\d\d:\d\d) · (\S+)/);if(!m)return null;
  const mt={};a.querySelectorAll('.metrics>div').forEach(x=>mt[x.querySelector('small').textContent.trim()]=x.querySelector('b').textContent.trim());
  const laps=[];a.querySelectorAll('details tbody tr').forEach(r=>{const c=[...r.cells].map(x=>x.textContent);laps.push(num(c[1]),mmss(c[2]),num(c[4]))});
  return[`${m[3]}-${m[2]}-${m[1]}`,m[4],m[5]==='treadmill_running'?'T':'R',a.querySelector('h3').textContent.trim(),num(mt['Distância']),mmss(mt['Tempo']),num(mt['FC média']),num(mt['FC máxima']),laps]}).filter(Boolean);
 const tabs=[...doc.querySelectorAll('table')],mo=tabs.find(t=>t.rows[0]&&t.rows[0].cells[0].textContent.trim()==='Mês');
 const m=mo?[...mo.querySelectorAll('tbody tr')].map(r=>[...r.cells].map((x,i)=>i?num(x.textContent):x.textContent.trim())):[];
 const rt=tabs.find(t=>t.rows[0]&&t.rows[0].cells[0].textContent.trim()==='Data'&&/Score sono/.test(t.rows[0].textContent));const seen=new Set(),r=[];
 if(rt)[...rt.querySelectorAll('tbody tr')].forEach(x=>{const c=[...x.cells].map(y=>y.textContent.trim());if(seen.has(c[0]))return;seen.add(c[0]);r.push([c[0],num(c[4]),num(c[5]),num(c[6])])});
 const h=[...doc.querySelectorAll('h2')].find(x=>/Sono, VFC/.test(x.textContent));const kv={};
 if(h){const tx=h.parentElement.innerText||h.parentElement.textContent;const g=re=>{const q=tx.match(re);return q?num(q[1]):null};
  kv.sono=(tx.match(/([\d.,]+ h)\s*\n?\s*Sono mais recente/)||[])[1]||null;kv.score=g(/([\d.,]+)\s*\n?\s*Pontuação do sono/);kv.vfc=g(/([\d.,]+) ms\s*\n?\s*VFC noturna/);kv.vfc7=g(/([\d.,]+) ms\s*\n?\s*VFC média semanal/);kv.bb=g(/([\d.,]+)\s*\n?\s*Body Battery/);kv.estresse=g(/([\d.,]+)\s*\n?\s*Estresse médio/);kv.fcr=g(/([\d.,]+) bpm\s*\n?\s*FC repouso/);kv.passos=g(/([\d.,]+)\s*\n?\s*Passos/);kv.spo2=g(/([\d.,]+)%\s*\n?\s*SpO/);kv.resp=g(/([\d.,]+) rpm/);kv.data=(tx.match(/Sono mais recente\s*·\s*(\d{4}-\d\d-\d\d)/)||[])[1]||null}
 return{a:acts,m,r,k:kv.data?kv:RAW.k}}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const doc=new DOMParser().parseFromString(await f.text(),'text/html');const d=parseSite(doc);
 if(!d.a.length)throw new Error('Nenhuma atividade encontrada neste HTML.');loadRaw(d);SRC=`${f.name} (importado em ${new Date().toLocaleDateString('pt-BR')})`;render()}catch(err){alert('Não consegui ler o arquivo: '+err.message)}e.target.value=''};

loadRaw(RAW);render();
</script>
</body>
</html>
