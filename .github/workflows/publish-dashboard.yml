name: Publish Garmin dashboard

on:
  workflow_run:
    workflows: ["Garmin activity sync"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download generated dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: garmin-performance-full
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifact

      - name: Prepare static site
        run: |
          mkdir site
          cp artifact/dashboard.html site/index.html
          if [ -f artifact/analysis.html ]; then cp artifact/analysis.html site/analysis.html; fi
          cat > site/README.txt <<'EOF'
          Garmin Performance dashboard publication.
          EOF

      - name: Publish site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -R site/. .
          git add index.html analysis.html README.txt 2>/dev/null || git add .
          git commit -m "Publish Garmin dashboard"
          git push --force origin publish
