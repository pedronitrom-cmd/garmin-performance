name: Publish Garmin dashboard

on:
  workflow_run:
    workflows: ["Garmin activity sync"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1

      - name: Download generated dashboard artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: garmin-performance-full
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifact

      - name: Prepare static site
        run: |
          mkdir site
          cp artifact/dashboard.html site/index.html
          if [ -f artifact/analysis.html ]; then cp artifact/analysis.html site/analysis.html; fi
          if [ -f artifact/performance.html ]; then cp artifact/performance.html site/performance.html; fi
          printf 'Garmin Performance dashboard publication.\\n' > site/README.txt

      - name: Publish site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git rm -rf . >/dev/null 2>&1 || true
          cp site/index.html .
          cp site/README.txt README.txt
          if [ -f site/analysis.html ]; then cp site/analysis.html .; fi
          if [ -f site/performance.html ]; then cp site/performance.html .; fi
          rm -rf artifact site
          git add index.html README.txt
          for f in analysis.html performance.html; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "Publish Garmin dashboard"
          git push --force origin publish
